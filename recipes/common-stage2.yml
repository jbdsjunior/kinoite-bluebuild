# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

# Etapa 2 — serviços, ferramentas, Flatpaks e kargs (comum a todos os flavors).
# Executada depois dos drivers do flavor (AMD e, no dual, NVIDIA/akmods), e antes
# do módulo `initramfs` declarado na receita final.
modules:
  - from-file: common-kvm.yml
  - from-file: common-tools.yml

  - from-file: common-systemd.yml
  - from-file: common-flatpaks.yml
  - from-file: common-kargs.yml
