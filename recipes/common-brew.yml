# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: brew
    nofile-limits: true
    brew-analytics: false

  - type: soar
    additional-repos: true
    auto-upgrade: true
    upgrade-interval: "daily"

  - type: dnf
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - homebrew
