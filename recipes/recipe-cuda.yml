# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kinoite-cuda
description: "Customized Fedora Kinoite image with headless NVIDIA CUDA compute layer"

base-image: quay.io/fedora/fedora-kinoite
image-version: latest

platforms:
  - linux/amd64

modules:
  # Domain-layered system, desktop, and cloud overlays
  - type: files
    files:
      - source: base
        destination: /
      - source: desktop
        destination: /
      - source: cloud
        destination: /

  # Consolidated RPM package set, fonts, multimedia codecs, and lean virtualization
  - from-file: modules/base-packages.yml
  - from-file: modules/desktop-fonts.yml

  # NVIDIA/akmods layer: must precede initramfs and follow the AMD drivers
  - from-file: modules/nvidia-headless.yml

  # Systemd units and Flatpaks
  - from-file: modules/base-systemd.yml
  - from-file: modules/desktop-flatpaks.yml

  - type: initramfs
    env:
      DRACUT_NO_XATTR: '1'

  - type: signing
