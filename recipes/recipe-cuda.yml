# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kinoite-cuda
description: "Customized Fedora Kinoite image with headless NVIDIA CUDA compute layer"

base-image: quay.io/fedora/fedora-kinoite
image-version: latest

platforms:
  - linux/amd64

modules:
  # Domain-layered configuration overlays (base, desktop, cloud, virt, ai)
  - type: files
    files:
      - source: base
        destination: /
      - source: desktop
        destination: /
      - source: cloud
        destination: /
      - source: virt
        destination: /
      - source: ai
        destination: /

  # Debloat, modular RPM package layers (DNF) and fonts
  - from-file: modules/common-debloat.yml
  - from-file: modules/common-core.yml
  - from-file: modules/common-multimedia.yml
  - from-file: modules/common-drivers.yml
  - from-file: modules/common-kvm.yml
  - from-file: modules/common-tools.yml
  - from-file: modules/common-fonts.yml

  # NVIDIA/akmods layer: must precede initramfs and follow the AMD drivers
  - from-file: modules/cuda-drivers-nvidia.yml

  # Systemd units and Flatpaks
  - from-file: modules/common-systemd.yml
  - from-file: modules/common-flatpaks.yml

  # Kernel arguments must come after every module that writes a kargs file
  - from-file: modules/common-kargs.yml

  - type: initramfs
    env:
      DRACUT_NO_XATTR: '1'

  - type: signing
