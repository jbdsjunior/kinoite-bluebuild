# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      keys:
        - https://repos.fyralabs.com/terra%OS_VERSION%/key.asc
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - terra.repo

    replace:
      # Mitigate upstream OpenCL packaging conflict (RHBZ #2332429)
      - from-repo: fedora
        install-weak-deps: false
        packages:
          - new: ocl-icd
            old: OpenCL-ICD-Loader

    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        # External Repository Packages (Terra & Tailscale)
        - topgrade
        - starship
        - tailscale
        - rsms-inter-vf-fonts
        - ms-core-fonts

        # Version Control & Cloud Sync
        - git
        - rclone

        # Modern CLI & Terminal Workflow
        - eza
        - bat
        - btop
        - ripgrep
        - fd-find
        - fzf
        - zoxide

        # Containers & Virtualization CLI
        - distrobox
        - docker-compose
        - podman-docker

        # System Information & Hardware Diagnostics
        - fastfetch
        - kernel-tools
        - rasdaemon
        - mesa-libOpenCL
        - clinfo
        - vulkan-tools
        - nvtop
