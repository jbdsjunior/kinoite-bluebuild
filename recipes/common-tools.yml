# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      # copr:
      #   - lilay/topgrade
      #   - atim/starship
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - topgrade
        - starship

  - type: dnf
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        # Version control & Sync
        - git
        - rclone

        # Modern CLI & Terminal Workflow
        - eza
        - bat
        - btop
        - ripgrep
        - fd-find
        - fzf
        - zoxide

        # Containers & Virtualization CLI
        - distrobox
        - docker-compose
        - podman-docker
        - podman-machine

        # System Information & Hardware Diagnostics
        - fastfetch
        - kernel-tools
        - mesa-libOpenCL
        - clinfo
        - vulkan-tools
        - nvtop
        - radeontop

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - tailscale
