# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - tailscale.repo
        - terra.repo

    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        # External Repository Packages (Terra & Tailscale)
        - topgrade
        - starship
        - tailscale

        # Cloud Sync
        - rclone

        # Containers & Virtualization CLI
        - distrobox
        - docker-compose
        - podman-docker

        # System Information & Hardware Diagnostics
        # vulkan-tools já é provido pelo base Kinoite (kinoite-shared)
        - fastfetch
        - nvtop
