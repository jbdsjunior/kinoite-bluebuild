# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - lilay/topgrade
        - atim/starship
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - topgrade
        - starship

  - type: dnf
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - git
        - rclone
        - wget
        - curl

  - type: dnf
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - podman
        - distrobox
        - docker-compose
        - podman-docker
        - buildah
        - skopeo

  - type: dnf
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - fastfetch
        - tailscale
        - fuse
        - fuse3
        - lsof
        - htop
        - btop
        - nvme-cli
        - smartmontools
