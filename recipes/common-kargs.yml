# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

# Baseline canônico de argumentos de kernel para imagens Fedora Kinoite
# Gerenciado via bootc (/usr/lib/bootc/kargs.d/) em total conformidade com AGENTS.md §4.
modules:
  - type: kargs
    kargs:
      # Prevenção de conflito de framebuffer primitivo com Mesa/DRM no early boot
      - initcall_blacklist=simpledrm_platform_driver_init
      # Bloqueio estrito do driver nouveau no initramfs e userspace
      - rd.driver.blacklist=nouveau
      - modprobe.blacklist=nouveau
