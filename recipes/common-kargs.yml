# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: kargs
    kargs:
      # AMD Zen 3 CPU frequency scaling & performance (Ryzen 9 5950X)
      - amd_pstate=active

      # AMD Zen 3 TSC stability & watchdog jitter elimination (Ryzen 9 5950X, 16C/32T dual-CCD)
      - tsc=reliable
      - nowatchdog

      # Virtualization / KVM / IOMMU passthrough defaults (AGENTS.md / docs/TECHNICAL_ARCHITECTURE.md)
      - iommu=pt

      # Peripheral stability (Bluetooth audio)
      - btusb.enable_autosuspend=n

      # Kernel & memory exploit mitigations (CIS Benchmark & KSPP)
      - slab_nomerge
      - vsyscall=none
