# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - tailscale.repo
        - terra.repo

    replace:
      # Mitigate upstream OpenCL packaging conflict (RHBZ #2332429)
      - from-repo: fedora
        install-weak-deps: false
        packages:
          - new: ocl-icd
            old: OpenCL-ICD-Loader

    install:
      allow-erasing: true
      packages:
        # External Repository Packages (Terra & Tailscale)
        - topgrade
        - starship
        - tailscale

        # Version Control & Cloud Sync
        - git
        - rclone

        # Containers & Virtualization CLI
        - distrobox

        # System Information & Hardware Diagnostics
        - mesa-libOpenCL
        - clinfo
        - vulkan-tools
        - nvtop
