# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - tailscale.repo
        - terra.repo

    install:
      allow-erasing: true
      packages:
        # Infrastructure, Cloud Sync, Containers & Terminal Tools
        - distrobox
        - fastfetch
        - git
        - nvtop
        - rclone
        - starship
        - tailscale
        - topgrade
