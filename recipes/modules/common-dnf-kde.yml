# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    replace:
      # Mitigate upstream OpenCL packaging conflict (RHBZ #2332429)
      - from-repo: fedora
        install-weak-deps: false
        packages:
          - new: ocl-icd
            old: OpenCL-ICD-Loader

    install:
      allow-erasing: true
      packages:
        # Localization, KDE Plasma Integration & Sensors
        - kio-admin
        - ksshaskpass
        - langpacks-pt_BR
        - lm_sensors
        - plasma-firewall
        - qt6-qtimageformats

        # System Typography (RPM)
        - rsms-inter-vf-fonts
