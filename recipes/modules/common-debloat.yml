# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    remove:
      auto-remove: true
      packages:
        # Redundant Base GUI Apps (replaced by Flatpaks)
        - firefox
        - kwrite

        # Conflicting System Package Managers (replaced by bootc / topgrade)
        - plasma-discover-notifier
        - plasma-discover-rpm-ostree

        # Intel-only Power & Thermal Daemons (AMD Ryzen workstation)
        - intel-lpmd
        - thermald
