# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion

    replace:
      # Mitigate upstream OpenCL packaging conflict (RHBZ #2332429)
      - from-repo: fedora
        install-weak-deps: false
        packages:
          - new: ocl-icd
            old: OpenCL-ICD-Loader

    install:
      allow-erasing: true
      packages:
        # Hardware Video Acceleration & GPU Compute (AMD Radeon / Mesa)
        - mesa-va-drivers-freeworld
        - mesa-libOpenCL

        # GPU & Driver Acceleration Diagnostics
        - clinfo
        - libva-utils
        - vulkan-tools
