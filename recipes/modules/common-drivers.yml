# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion

    replace:
      # Mitigate upstream OpenCL packaging conflict (RHBZ #2332429)
      - from-repo: fedora
        install-weak-deps: false
        packages:
          - new: ocl-icd
            old: OpenCL-ICD-Loader

    install:
      allow-erasing: true
      packages:
        # Hardware Acceleration & Multimedia Codecs (RPM Fusion)
        - ffmpeg
        - gstreamer1-plugins-bad-free-extras
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - libheif-freeworld
        - mesa-va-drivers-freeworld

        # OpenCL Compute & Acceleration Stack
        - mesa-libOpenCL

        # GPU & Acceleration Diagnostics
        - clinfo
        - libva-utils
        - vulkan-tools
