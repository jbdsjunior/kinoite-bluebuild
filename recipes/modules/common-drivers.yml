# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
      cleanup: true
    install:
      allow-erasing: true
      packages:
        # Hardware Acceleration & Mesa Freeworld (AMD GPU)
        - mesa-va-drivers-freeworld

        # Video Codecs & FFmpeg (RPM Fusion for Dolphin thumbnails & CLI)
        - ffmpeg
        - libva-utils
        - libheif-freeworld

        # GStreamer Freeworld Plugins
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-bad-free-extras
        - gstreamer1-plugins-ugly
