# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
      files:
        - tailscale.repo
        - terra.repo

    remove:
      auto-remove: true
      packages:
        - firefox
        - kwrite
        - plasma-discover-rpm-ostree
        - plasma-discover-notifier

    replace:
      # Mitigate upstream OpenCL packaging conflict (RHBZ #2332429)
      - from-repo: fedora
        install-weak-deps: false
        packages:
          - new: ocl-icd
            old: OpenCL-ICD-Loader

    install:
      allow-erasing: true
      exclude:
        - virt-viewer
      packages:
        # Localization, KDE Plasma Integration & Sensors
        - kio-admin
        - ksshaskpass
        - langpacks-pt_BR
        - lm_sensors
        - plasma-firewall
        - qt6-qtimageformats

        # System Typography (RPM)
        - rsms-inter-vf-fonts

        # Hardware Acceleration & Multimedia Codecs (RPM Fusion)
        - ffmpeg
        - gstreamer1-plugins-bad-free-extras
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - libheif-freeworld
        - libva-utils
        - mesa-va-drivers-freeworld

        # Virtualization Stack (KVM / QEMU / Libvirt / GNOME Boxes)
        - "@virtualization"
        - gnome-boxes

        # Infrastructure, Cloud Sync, Containers & GPU Diagnostics
        - clinfo
        - distrobox
        - fastfetch
        - git
        - mesa-libOpenCL
        - nvtop
        - rclone
        - starship
        - tailscale
        - topgrade
        - vulkan-tools
