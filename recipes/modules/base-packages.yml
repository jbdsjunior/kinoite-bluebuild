# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
      files:
        - tailscale.repo
        - terra.repo

    remove:
      auto-remove: true
      packages:
        - firefox
        - intel-lpmd
        - kwrite
        - plasma-discover-notifier
        - plasma-discover-rpm-ostree
        - thermald

    install:
      allow-erasing: true
      packages:
        # Localization, KDE Plasma Integration & Sensors
        - kio-admin
        - ksshaskpass
        - langpacks-pt_BR
        - lm_sensors
        - plasma-firewall
        - qt6-qtimageformats

        # System Typography (RPM)
        - rsms-inter-vf-fonts

        # Hardware Acceleration & Multimedia Codecs (RPM Fusion)
        - ffmpeg
        - gstreamer1-plugins-bad-free-extras
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - libheif-freeworld
        - libva-utils
        - mesa-va-drivers-freeworld

        # Lean Virtualization Stack (KVM / QEMU / Libvirt / GNOME Boxes + virt-manager)
        - edk2-ovmf
        - gnome-boxes
        - libvirt-client
        - libvirt-daemon-config-network
        - libvirt-daemon-kvm
        - qemu-kvm
        - swtpm
        - swtpm-tools
        - virt-install
        - virt-manager

        # Infrastructure, Cloud Sync, Containers & GPU Diagnostics
        - distrobox
        - fastfetch
        - git
        - nvtop
        - rclone
        - starship
        - tailscale
        - topgrade
        - vulkan-tools
