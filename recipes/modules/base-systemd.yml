# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: systemd
    system:
      masked:
        - NetworkManager-wait-online.service
        - dnf-makecache.timer
        - lm_sensors.service
        - raid-check.timer
      enabled:
        # Base update automation & maintenance timers (no upstream preset)
        - bootc-fetch-apply-updates.timer
        - flatpak-system-update.timer
        - kinoite-maintenance.timer
        - kinoite-btrfs-scrub.timer

        # Container automation (Podman)
        - podman-restart.service
        - podman-auto-update.timer

        # Mesh VPN (tailscale package ships no systemd preset)
        - tailscaled.service

        # NOTE: systemd-resolved, firewalld, and the modular libvirt sockets
        # (virtqemud/virtnetworkd/virtstoraged/etc.) are preset-enabled by
        # Fedora upstream and activated on demand. ModemManager stays unmasked
        # so NetworkManager-bluetooth avoids D-Bus activation errors.

    user:
      masked:
        - drkonqi-coredump-pickup.service
      enabled:
        - flatpak-user-update.timer
        - kinoite-user-maintenance.timer
        - podman-auto-update.timer
        - podman-restart.service
