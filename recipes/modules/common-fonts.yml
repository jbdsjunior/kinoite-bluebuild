# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  # Monospace & Terminal Icon Fonts (Nerd Fonts)
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - NerdFontsSymbolsOnly

  # System UI Typography (RPM)
  - type: dnf
    install:
      allow-erasing: true
      packages:
        - rsms-inter-vf-fonts
