# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - liberation-fonts-all
        - fira-code-fonts
        - rsms-inter-vf-fonts
        - ms-core-fonts
        - google-noto-sans-cjk-fonts # Noto CJK fallback para Flatpaks e WebKitGTK (estático)

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - NerdFontsSymbolsOnly
