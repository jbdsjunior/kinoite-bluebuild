# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        # --- Compatibilidade e UI Base ---
        - liberation-fonts                 # Clone livre das fontes MS (Arial, Times, Courier)
        - google-noto-sans-fonts           # Fonte Sans-serif universal (Fallback principal do KDE/Web)
        - google-noto-serif-fonts          # Fonte Serif universal (Documentos e Web)
        
        # --- Emojis e Símbolos (Crítico para Web/KDE) ---
        - google-noto-color-emoji-fonts    # Emojis coloridos modernos (Evita emojis preto-e-branco feios)
        - fontawesome-fonts                # Ícones FontAwesome (Usado em scripts, Polybar, Waybar, etc)

        # --- Desenvolvimento (A "Trindade" do Dev) ---
        - jetbrains-mono-fonts             # A melhor fonte para coding (Ligatures, excelente leitura)
        - google-noto-sans-mono-fonts      # Fallback monospace limpo e universal

        # --- Suporte Internacional (Otimizado) ---
        # Usamos a versão TTC (TrueType Collection) que é muito mais leve que o pacote CJK completo,
        # mas ainda garante que você não veja "quadrados brancos" ao acessar sites asiáticos.
        - google-noto-sans-cjk-ttc-fonts   # Suporte leve para Chinês, Japonês e Coreano

  # ==========================================
  # BLOCO 2: Repositório Terra (Third-Party)
  # Fontes proprietárias e Nerd Fonts para Terminal
  # ==========================================
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - nerdfontssymbolsonly-nerd-fonts  # [OURO] Injeta ícones em QUALQUER fonte base (ex: JetBrains)
        - firacode-nerd-fonts              # Clássica com ligaturas e ícones integrados
        - hack-nerd-fonts                  # Leve, alta legibilidade, sem ligaturas (ótima para terminais pequenos)
        - ms-core-fonts                    # Arial, Times New Roman, Verdana, etc. (Reais)
