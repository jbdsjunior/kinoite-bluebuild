# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - liberation-fonts
        - rsms-inter-vf-fonts

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - noto-nerd-fonts
        - liberationmono-nerd-fonts
        - nerdfontssymbolsonly-nerd-fonts
        - firamono-nerd-fonts
        - jetbrainsmono-nerd-fonts
        - firacode-nerd-fonts
        - ms-core-fonts
