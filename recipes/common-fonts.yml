# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - liberation-fonts-all
        - fira-code-fonts
        - rsms-inter-vf-fonts
        - ms-core-fonts
        - wqy-zenhei-fonts # Fallback CJK universal para Flatpaks e WebKitGTK
        - google-noto-sans-cjk-fonts # Noto CJK tradicional (estático)

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - NerdFontsSymbolsOnly
