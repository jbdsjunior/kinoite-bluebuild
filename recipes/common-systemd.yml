# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: systemd
    system:
      masked:
        - systemd-remount-fs.service
      enabled:
        # Base update automation & timers (no upstream preset)
        - bootc-fetch-apply-updates.timer
        - flatpak-system-update.timer

        # Container automation (Podman)
        - podman-restart.service
        - podman-auto-update.timer

        # Mesh VPN (tailscale package ships no systemd preset)
        - tailscaled.service

        # NOTE: systemd-resolved, firewalld and the modular libvirt sockets
        # (virtqemud/virtnetworkd/virtstoraged/virtnodedevd/virtproxyd/
        # virtsecretd/virtnwfilterd) are preset-enabled by Fedora 44
        # (90-default.preset) and applied at build time; re-declaring them
        # is forbidden (AGENTS.md section 5).

    user:
      enabled:
        - flatpak-user-update.timer
        - podman-auto-update.timer
        - podman-restart.service
        - soar-upgrade-packages.timer
