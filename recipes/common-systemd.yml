# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: systemd
    system:
      # masked:
      #   - systemd-remount-fs.service
      disabled:
        # Virtual machine guest services (bare-metal system)
        # - vboxservice.service
        # - vmtoolsd.service
        # - vgauthd.service
        # - qemu-guest-agent.service
        # Intel-specific hardware error logging (AMD CPU)
        - mcelog.service

      enabled:
        # Base update timers
        - bootc-fetch-apply-updates.timer
        - flatpak-system-update.timer

        # Container automation (Podman)
        - podman-restart.service
        - podman-auto-update.timer

        # Network and DNS
        - systemd-resolved.service
        - firewalld.service
        - tailscaled.service

        # Virtualization / KVM sockets (modular libvirt daemons)
        - virtqemud.socket
        - virtnetworkd.socket
        - virtstoraged.socket
        - virtnodedevd.socket
        - virtproxyd.socket
        - virtsecretd.socket
        - virtnwfilterd.socket

    user:
      enabled:
        - flatpak-user-update.timer
        - podman-auto-update.timer
        - podman-restart.service
        - soar-upgrade-packages.timer
