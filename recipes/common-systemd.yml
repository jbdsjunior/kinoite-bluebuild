# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: systemd
    system:
      masked:
        - systemd-remount-fs.service
      disabled:
        # Virtual machine guest services (bare-metal system)
        - vboxservice.service
        - vmtoolsd.service
        - vgauthd.service
        - qemu-guest-agent.service

        # Intel-specific hardware error logging (AMD CPU)
        - mcelog.service

      enabled:
        # Base update timers
        - rpm-ostreed-automatic.timer
        - flatpak-system-update.timer

        # Container automation (Podman)
        - podman-restart.service
        - podman-auto-update.service

        # CPU performance tuning
        - cpupower.service

        # Network and DNS
        - systemd-resolved.service
        - firewalld.service

    user:
      enabled:
        - flatpak-user-update.timer
