# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: systemd
    system:
      masked:
        - systemd-remount-fs.service
      enabled:
        # Base update automation & timers
        - bootc-fetch-apply-updates.timer
        - flatpak-system-update.timer

        # Container automation (Podman)
        - podman-restart.service
        - podman-auto-update.timer

        # Network and DNS
        - systemd-resolved.service
        - firewalld.service
        - tailscaled.service

        # Virtualization / KVM sockets (modular libvirt daemons)
        - virtqemud.socket
        - virtnetworkd.socket
        - virtstoraged.socket
        - virtnodedevd.socket
        - virtproxyd.socket
        - virtsecretd.socket
        - virtnwfilterd.socket

    user:
      enabled:
        - flatpak-user-update.timer
        - podman-auto-update.timer
        - podman-restart.service
        - soar-upgrade-packages.timer
