# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          # OBS Studio Plugins
          - com.obsproject.Studio.Plugin.GStreamerVaapi/x86_64/stable
          - com.obsproject.Studio.Plugin.Gstreamer/x86_64/stable

          # OpenH264 (Compatibilidade WebRTC / H.264 em navegadores e players)
          - org.freedesktop.Platform.openh264/x86_64/2.4.1
          - org.freedesktop.Platform.openh264/x86_64/2.3.1

          # Drivers Gráficos Mesa / VA-API AMD (Garante sincronização de versão com os runtimes)
          - org.freedesktop.Platform.GL.default/x86_64/24.08
          - org.freedesktop.Platform.GL.default/x86_64/23.08

          # Codecs de Vídeo / FFmpeg (Freedesktop Runtimes 23.08 e 24.08)
          - org.freedesktop.Platform.ffmpeg-full/x86_64/24.08
          - org.freedesktop.Platform.ffmpeg-full/x86_64/23.08

          # --- CORE DESKTOP ENVIRONMENTS ---
