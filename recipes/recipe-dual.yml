# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kinoite-dual
description: "Customized Fedora Kinoite image for Dual-GPU workstations (AMD display + NVIDIA compute)"

base-image: quay.io/fedora/fedora-kinoite
image-version: latest

platforms:
  - linux/amd64

modules:
  - from-file: common-stage1.yml

  # NVIDIA/akmods entre as etapas: preserva a precedência dos kargs de
  # common-kargs.yml (etapa 2) sobre o arquivo gerado pelo akmods.
  - from-file: common-drivers-nvidia.yml

  - from-file: common-stage2.yml

  - type: initramfs
    env:
      DRACUT_NO_XATTR: '1'

  - type: signing
