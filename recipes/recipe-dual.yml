# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kinoite-dual
description: "Customized Fedora Kinoite image for Dual-GPU workstations (AMD display + NVIDIA compute)"

base-image: quay.io/fedora/fedora-kinoite
image-version: latest

platforms:
  - linux/amd64

modules:
  # System-wide configuration overlays (sysctl, tmpfiles, systemd, udev, polkit)
  - type: files
    files:
      - source: system
        destination: /

  # Package set: debloat, core apps, fonts and AMD/multimedia drivers
  - from-file: modules/common-debloat.yml
  - from-file: modules/common-core.yml
  - from-file: modules/common-fonts.yml
  - from-file: modules/common-drivers.yml

  # NVIDIA/akmods layer: must precede initramfs and follow the AMD drivers
  - from-file: modules/common-drivers-nvidia.yml

  # Virtualization, CLI tooling, services and Flatpaks
  - from-file: modules/common-kvm.yml
  - from-file: modules/common-tools.yml
  - from-file: modules/common-systemd.yml
  - from-file: modules/common-flatpaks.yml

  # Kernel arguments must come after every module that writes a kargs file
  - from-file: modules/common-kargs.yml

  - type: initramfs
    env:
      DRACUT_NO_XATTR: '1'

  - type: signing
