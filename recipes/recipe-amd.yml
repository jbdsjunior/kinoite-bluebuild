# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kinoite-amd
description: "Customized Fedora Kinoite image optimized for AMD-only systems"

base-image: quay.io/fedora/fedora-kinoite
image-version: latest

platforms:
  - linux/amd64

modules:
  - from-file: common-stage1.yml
  - from-file: common-stage2.yml

  - type: initramfs
    env:
      DRACUT_NO_XATTR: '1'

  - type: signing
