# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: kinoite-amd
description: "Customized Fedora Kinoite image optimized for AMD-only systems"

base-image: quay.io/fedora/fedora-kinoite
image-version: latest

platforms:
  - linux/amd64

modules:
  # System-wide configuration overlays (sysctl, tmpfiles, systemd, udev, polkit)
  - type: files
    files:
      - source: system
        destination: /

  # Consolidated RPM package set, fonts, multimedia codecs and virtualization
  - from-file: modules/common-packages.yml
  - from-file: modules/common-fonts.yml

  # Systemd units and Flatpaks
  - from-file: modules/common-systemd.yml
  - from-file: modules/common-flatpaks.yml

  # Kernel arguments must come after every module that writes a kargs file
  - from-file: modules/common-kargs.yml

  - type: initramfs
    env:
      DRACUT_NO_XATTR: '1'

  - type: signing
