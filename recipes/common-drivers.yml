# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        - "@multimedia"
        - "@sound-and-video"
        # - mesa-va-drivers-freeworld
        # - mesa-vulkan-drivers-freeworld
        # - ffmpeg
        # - ffmpeg-libs
        # - gstreamer1-plugins-bad-freeworld
        # - gstreamer1-plugins-ugly
        # - libavcodec-freeworld
        # - heif-pixbuf-loader
        # - libheif-tools
        # - fdk-aac
        # - x264-libs
        # - x265-libs

        # - rocm-smi
        # - rocm-hip
        # - rocm-opencl
        # - rocm-runtime
        # - rocblas
        # - rocm-clinfo

modules:
  - type: bling
    install:
      - negativo17

  - type: dnf
    repos:
      cleanup: true
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - ublue-os/bazzite
        - ublue-os/bazzite-multilib
    remove:
      - mesa-va-drivers
      - pipewire-config-raop
    replace:
      - from-repo: terra
        skip-unavailable: true
        packages:
          - mesa-dri-drivers
          - mesa-filesystem
          - mesa-libEGL
          - mesa-libGL
          - mesa-libgbm
          - mesa-vulkan-drivers
      - from-repo: copr:copr.fedorainfracloud.org:ublue-os:bazzite
        skip-unavailable: true
        packages:
          - wireplumber
      - from-repo: copr:copr.fedorainfracloud.org:ublue-os:bazzite-multilib
        skip-unavailable: true
        packages:
          - bluez
          - bluez-cups
          - bluez-libs
          - bluez-obexd
          - xorg-x11-server-Xwayland

  - type: dnf
    install:
      packages:
        - libopenjph
        - libfreeaptx
        - amdsmi
        - ryzenadj
        - scx-scheds
        - scx-tools
        - vulkan-low-latency-layer
        - vulkan-tools
        - libbluray
        - libbluray-utils
        - makemkv
        - repo: terra
          packages:
            - mesa-libOpenCL
            - clinfo
            - terra-gamescope
            - terra-gamescope-libs
        - repo: fedora-multimedia
          packages:
            - ffmpeg-libs
            - heif-pixbuf-loader
            - libva-utils
            - pipewire-libs-extra
    replace:
      - from-repo: fedora-multimedia
        skip-unavailable: true
        packages:
          - libheif
          - libva
      - from-repo: fedora-multimedia
        packages:
          - old: ffmpeg-free
            new: ffmpeg
          - old: libavcodec-free
            new: libavcodec
          - old: libfdk-aac-free
            new: libfdk-aac
