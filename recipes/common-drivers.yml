# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        - "@multimedia"
        - "@sound-and-video"

  - type: dnf
    repos:
      nonfree: rpmfusion
      cleanup: true
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        - mesa-va-drivers-freeworld
        - mesa-vulkan-drivers-freeworld

  - type: dnf
    repos:
      nonfree: rpmfusion
      cleanup: true
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        - ffmpeg
        - ffmpeg-libs

        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-bad-free-extras
        - gstreamer1-plugins-ugly
        - gstreamer1-vaapi

        - pipewire-codec-aptx

        # - libva #
        - libva-utils

        - twolame # Codificador MPEG-2
        - vorbis-tools # Ferramentas Ogg Vorbis


