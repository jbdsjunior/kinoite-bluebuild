# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
      cleanup: true
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        # Hardware Acceleration & Mesa Freeworld (AMD GPU)
        - mesa-va-drivers-freeworld
        - mesa-vulkan-drivers-freeworld

        # Video Codecs & FFmpeg (RPM Fusion)
        - ffmpeg
        - ffmpeg-libs
        - libva-utils
        - libavcodec-freeworld
        - libheif-freeworld

        # GStreamer Freeworld Plugins
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-bad-free-extras
        - gstreamer1-plugins-ugly
        - gstreamer1-vaapi

        # Audio Codecs (Bluetooth aptX & encoders)
        - pipewire-codec-aptx
        - twolame
        - vorbis-tools
