# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        - "@multimedia"
        - "@sound-and-video"
        # - mesa-va-drivers-freeworld
        # - mesa-vulkan-drivers-freeworld
        # - ffmpeg
        # - ffmpeg-libs
        # - gstreamer1-plugins-bad-freeworld
        # - gstreamer1-plugins-ugly
        # - libavcodec-freeworld
        # - heif-pixbuf-loader
        # - libheif-tools
        # - fdk-aac
        # - x264-libs
        # - x265-libs

        # - rocm-smi
        # - rocm-hip
        # - rocm-opencl
        # - rocm-runtime
        # - rocblas
        # - rocm-clinfo

- type: dnf
  repos:
    cleanup: true
    files:
      - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
  replace:
    - from-repo: terra-mesa
      skip-unavailable: true
      packages:
        - mesa-dri-drivers
        - mesa-filesystem
        - mesa-libEGL
        - mesa-libGL
        - mesa-libgbm
        - mesa-vulkan-drivers

- type: dnf
  repos:
    nonfree: negativo17
  install:
    packages:
      - libopenjph
      - repo: fedora-multimedia
        packages:
          - ffmpeg-libs
          - heif-pixbuf-loader
          - libva-utils
          - pipewire-libs-extra
  replace:
    - from-repo: fedora-multimedia
      skip-unavailable: true
      packages:
        - libheif
        - libva
    - from-repo: fedora-multimedia
      packages:
        - old: ffmpeg-free
          new: ffmpeg
        - old: libavcodec-free
          new: libavcodec
        - old: libfdk-aac-free
          new: libfdk-aac
