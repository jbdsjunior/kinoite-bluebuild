# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        - mesa-va-drivers-freeworld  # bling rpmfusion
        - mesa-vulkan-drivers-freeworld  # bling rpmfusion

  - type: dnf
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        - ffmpeg
        - ffmpeg-libs

        - libva
        - libva-utils

        - gstreamer1-plugin-libav
        - gstreamer1-plugins-bad-free-extras
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-vaapi

  - type: dnf
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        # Suporte a formatos proprietários comuns
        - pipewire-codec-aptx          # Codec aptX para áudio Bluetooth de alta qualidade
        - lame                         # Codificador MP3
        - twolame                      # Codificador MPEG-2
        - vorbis-tools                 # Ferramentas Ogg Vorbis

