# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
      cleanup: true
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        - mesa-va-drivers-freeworld
        - mesa-vulkan-drivers-freeworld

  - type: dnf
    repos:
      nonfree: rpmfusion
      cleanup: true
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        - ffmpeg # rpmfusion
        - ffmpeg-libs # rpmfusion

        # - libva # is already installed
        - libva-utils

        # - gstreamer1-plugin-libav # is already installed
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-bad-free-extras # rpmfusion
        - gstreamer1-plugins-ugly # rpmfusion
        - gstreamer1-vaapi

  - type: dnf
    repos:
      nonfree: rpmfusion
      cleanup: true
    install:
      allow-erasing: true
      skip-unavailable: true
      packages:
        - pipewire-codec-aptx # rpmfusion # Codec aptX para áudio Bluetooth de alta qualidade
        # - lame                         # Codificador MP3 # is already installed
        - twolame # Codificador MPEG-2
        - vorbis-tools # Ferramentas Ogg Vorbis


