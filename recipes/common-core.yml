# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - langpacks-pt_BR
        - tesseract-langpack-por

        - lm_sensors
        - plasma-firewall
        - smartmontools

        - icoutils
        - kio-admin
        - ksshaskpass
        - kf6-kimageformats
        - qt6-qtimageformats

        - kate

        - elisa-player
        - gwenview
        - haruna
