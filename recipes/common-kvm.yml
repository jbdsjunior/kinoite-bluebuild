# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - "@virtualization"
        - gnome-boxes
      exclude:
        - virt-viewer

  - type: systemd
    system:
      enabled:
        # - libvirtd.service
        # - virtlogd.service
        - libvirtd.service            # Daemon principal do libvirt
        - virtlogd.service            # Gerenciamento de logs de VMs
        - virtlockd.service           # Gerenciamento de locks de VMs
        - libvirtd-admin.socket       # Socket para administração do libvirt

  # - type: kargs
  #   kargs:
