# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    install:
      skip-unavailable: true
      allow-erasing: true
      packages:
        - "@virtualization"
        - gnome-boxes
        - virt-viewer
        - virt-manager
        - libvirt-daemon-config-network
        - libvirt-daemon-kvm
        - qemu-img
        - edk2-ovmf

  - type: systemd
    system:
      enabled:
        - libvirtd.service
        - virtlogd.service
