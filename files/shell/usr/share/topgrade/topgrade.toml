# Declarative baseline overrides for Topgrade on Fedora Kinoite (always enforced via 60-shell-aliases.sh)

[misc]
# Disable steps that conflict with immutable OS package management or Distrobox containers
disable = ["toolbx", "tailscale"]

# Run non-interactively across all steps (passes -y/--yes to flatpak/gearlever, avoids TTY hangs)
assume_yes = true
cleanup = true
ask_retry = false
auto_retry = 2

[linux]
# Use passwordless rpm-ostree (via Polkit) instead of sudo bootc upgrade in interactive topgrade
# (bootc-fetch-apply-updates.timer and alias 'sysup' still handle native bootc upgrades/kargs.d)
bootc = false
rpm_ostree = true
