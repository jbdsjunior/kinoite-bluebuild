<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Generic font family defaults -->
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Noto Sans</string>
      <string>Liberation Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif</string>
      <string>Liberation Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>FiraCode Nerd Font</string>
      <string>Hack</string>
      <string>Noto Sans Mono</string>
      <string>Liberation Mono</string>
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>

  <!-- Modern UI and system font aliases (CSS / Apple / Microsoft) -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Inter</string>
      <string>system-ui</string>
      <string>ui-sans-serif</string>
      <string>-apple-system</string>
      <string>BlinkMacSystemFont</string>
      <string>SF Pro Text</string>
      <string>SF Pro Display</string>
      <string>SF Pro</string>
      <string>Helvetica Neue</string>
      <string>Segoe UI</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Noto Sans</string>
    </edit>
  </match>

  <!-- Modern code and terminal monospace font aliases -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>ui-monospace</string>
      <string>Menlo</string>
      <string>Monaco</string>
      <string>SF Mono</string>
      <string>SFMono</string>
      <string>SFMono-Regular</string>
      <string>Cascadia Code</string>
      <string>Cascadia Mono</string>
      <string>Consolas</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>FiraCode Nerd Font</string>
    </edit>
  </match>
</fontconfig>
