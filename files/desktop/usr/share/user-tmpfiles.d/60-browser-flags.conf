# Always enforce declarative Wayland and AMD GPU flags for Flatpak browsers (overwrites local edits)
d %h/.var/app/com.google.Chrome/config 0755 - - -
C+ %h/.var/app/com.google.Chrome/config/chrome-flags.conf 0644 - - - /usr/share/kinoite/browsers/chromium-flags.conf
d %h/.var/app/com.brave.Browser/config 0755 - - -
C+ %h/.var/app/com.brave.Browser/config/brave-flags.conf 0644 - - - /usr/share/kinoite/browsers/chromium-flags.conf
