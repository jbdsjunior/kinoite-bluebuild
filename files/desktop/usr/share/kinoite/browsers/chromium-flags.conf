# Native Wayland (KDE Plasma 6)
--ozone-platform=wayland

# AMD Radeon RX 6600 XT GPU rasterization, zero-copy DMA-BUF & smooth scrolling
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--enable-smooth-scrolling

# Hardware VA-API video encoding
--enable-features=AcceleratedVideoEncoder

# Telemetry and background bloat reduction
--disable-breakpad
--no-pings
--disable-domain-reliability
