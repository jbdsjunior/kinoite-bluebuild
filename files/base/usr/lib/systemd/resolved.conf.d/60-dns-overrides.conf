[Resolve]
# Primary DNS: Control D (p2 / Block Malware + Ads + Trackers) with DNS-over-TLS (DoT)
DNS=76.76.2.11#p2.freedns.controld.com 76.76.10.11#p2.freedns.controld.com 2606:1a40::11#p2.freedns.controld.com 2606:1a40:1::11#p2.freedns.controld.com

# Fallback DNS: Cloudflare with DNS-over-TLS (DoT)
FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com

# Opportunistic DoT preserves Control D encrypted DNS while allowing seamless fallback with Tailscale MagicDNS or ISP DHCP resolvers when VPN is disconnected
DNSOverTLS=opportunistic

# DNSSEC must be 'no' when using adblocking resolvers (synthetic NXDOMAIN/0.0.0.0 answers break DNSSEC validation)
DNSSEC=no

# Avahi owns mDNS (.local) via mdns4_minimal in /etc/nsswitch.conf; disable here to avoid port 5353 conflicts
MulticastDNS=no
LLMNR=no
