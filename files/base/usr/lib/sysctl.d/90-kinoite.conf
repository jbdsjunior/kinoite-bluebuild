# Consolidated kernel, memory, ZRAM, NVMe, and network tuning for Fedora Kinoite

# Kernel: safe emergency SysRq (REISUB) and pointer restriction
kernel.sysrq = 1
kernel.kptr_restrict = 1

# Filesystem: raise inotify instances for IDEs, Flatpaks, and rootless Podman
fs.inotify.max_user_instances = 8192

# Memory & NVMe: favor in-RAM ZRAM zstd compaction and cap dirty writeback bursts on 64 GB RAM
vm.swappiness = 150
vm.page-cluster = 0
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# Network: TCP BBR + Fair Queueing, VPN Path MTU probing, RFC 1337, and ICMP redirect hardening
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
