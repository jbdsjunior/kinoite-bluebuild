# =====================================================================
# MEMORY & FILE SYSTEM: Inotify Instances & ZRAM Tuning
# =====================================================================

# FILESYSTEM: Prevent ENOSPC errors on file watcher instances across IDEs (VS Code) and Podman containers
# (Fedora 45 already auto-scales fs.inotify.max_user_watches by RAM)
fs.inotify.max_user_instances = 8192

# ZRAM OPTIMIZATION: Proactive anonymous compaction into zstd-compressed in-RAM ZRAM swap, freeing physical RAM for pagecache
vm.swappiness = 150

# ZRAM OPTIMIZATION: Disable multi-page sequential readahead clustering (saves CPU decompression on random-access ZRAM)
vm.page-cluster = 0
