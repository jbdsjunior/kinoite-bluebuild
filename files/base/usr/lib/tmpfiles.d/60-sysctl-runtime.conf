# Register declarative system sysctls in ephemeral /run/sysctl.d so TuneD's
# reapply_sysctl=1 honors project tuning (ZRAM 150, BBR/FQ, SysRq) across power
# profiles without leaving persistent symlinks in /etc/sysctl.d.
d /run/sysctl.d 0755 root root -
L+ /run/sysctl.d/90-kernel.conf - - - - /usr/lib/sysctl.d/90-kernel.conf
L+ /run/sysctl.d/90-memory.conf - - - - /usr/lib/sysctl.d/90-memory.conf
L+ /run/sysctl.d/90-network.conf - - - - /usr/lib/sysctl.d/90-network.conf
