# Desativa o módulo nvidia-drm em arquitetura Dual-GPU (AMD display + NVIDIA compute).
# A placa NVIDIA RTX 3080 Ti opera exclusivamente como aceleradora de IA e computação (CUDA/CDI),
# enquanto a AMD Radeon RX 6600 XT é a GPU primária do desktop Wayland e das máquinas virtuais.
# O bloqueio do nvidia-drm impede a criação de /dev/dri/renderD129, garantindo que o Libvirt/QEMU
# selecione deterministicamente a GPU AMD (renderD128) para aceleração 3D no GNOME Boxes.
blacklist nvidia-drm
options nvidia-drm modeset=0
