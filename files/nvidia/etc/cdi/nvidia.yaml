---
cdiVersion: "0.5.0"
kind: "nvidia.com/gpu"
devices:
  - name: "0"
    containerEdits:
      deviceNodes:
        - path: "/dev/nvidia0"
        - path: "/dev/nvidiactl"
        - path: "/dev/nvidia-uvm"
        - path: "/dev/nvidia-uvm-tools"
        - path: "/dev/nvidia-modeset"
  - name: "all"
    containerEdits:
      deviceNodes:
        - path: "/dev/nvidia0"
        - path: "/dev/nvidiactl"
        - path: "/dev/nvidia-uvm"
        - path: "/dev/nvidia-uvm-tools"
        - path: "/dev/nvidia-modeset"

