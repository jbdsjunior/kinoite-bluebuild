# Declarative power, clock-cap and V/F curve profile for headless NVIDIA compute GPUs.
# Built-in profiles (all keep clocks unlocked by default to preserve deep P8 ~16W idle & Fan Stop):
#   efficiency     -> 285W PL, unlocked clocks, +100 MHz core / +500 MHz mem (P0/P2)
#   balanced-safe  -> 290W PL, unlocked clocks, 0 MHz offsets
#   performance    -> Max VBIOS PL, unlocked clocks, +100 MHz core / +1000 MHz mem (P0/P2)
#   stock          -> Default VBIOS power limit, unlocked clocks, 0 MHz offsets
#
# To override locally without modifying the image, create /etc/kinoite/nvidia-tune.conf.
NVIDIA_TUNE_PROFILE=efficiency

# Optional per-parameter overrides (uncomment in /etc/kinoite/nvidia-tune.conf):
# Note: setting NVIDIA_GPU_MAX_CLOCK_MHZ > 0 uses nvmlDeviceSetGpuLockedClocks, which
# prevents deep P8 rail gating on Ampere (~28W idle instead of ~16W). Leave 0 for best idle.
# NVIDIA_POWER_LIMIT_W=285
# NVIDIA_GPU_MIN_CLOCK_MHZ=0
# NVIDIA_GPU_MAX_CLOCK_MHZ=0
# NVIDIA_GPU_CLOCK_OFFSET_MHZ=100
# NVIDIA_MEM_CLOCK_OFFSET_MHZ=500
