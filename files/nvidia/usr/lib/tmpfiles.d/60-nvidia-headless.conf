# Prioritize Mesa EGL vendor over 10_nvidia.json for all host processes (including stripped-env libvirt/QEMU)
# while preserving /usr/share/glvnd/egl_vendor.d/10_nvidia.json for nvidia-ctk CDI generation.
d /etc/glvnd/egl_vendor.d 0755 root root -
L+ /etc/glvnd/egl_vendor.d/00_mesa.json - - - - /usr/share/glvnd/egl_vendor.d/50_mesa.json
