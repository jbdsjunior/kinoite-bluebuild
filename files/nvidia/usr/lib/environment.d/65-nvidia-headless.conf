# Isolate host rendering to Mesa (AMD Radeon RX 6600 XT) across EGL and GLX
# (Vulkan RADV is already pinned by 60-desktop.conf) while keeping the
# NVIDIA RTX 3080 Ti reserved for headless CUDA/CDI compute.
__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
__GLX_VENDOR_LIBRARY_NAME=mesa
