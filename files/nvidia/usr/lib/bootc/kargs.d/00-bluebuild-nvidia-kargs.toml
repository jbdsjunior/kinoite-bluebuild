# Baseline declarativo de kargs headless para GPU NVIDIA secundária (AMD display + NVIDIA compute)
# Sobrescreve a configuração automática do akmods, blindando Wayland e VMs QEMU
kargs = [
  "initcall_blacklist=simpledrm_platform_driver_init",
  "rd.driver.blacklist=nouveau",
  "modprobe.blacklist=nouveau",
  "rd.driver.blacklist=nvidia-drm",
  "modprobe.blacklist=nvidia-drm",
]
