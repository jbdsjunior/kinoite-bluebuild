# Desativa completamente o carregamento de nvidia-drm / nvidia_drm em arquitetura Dual-GPU (AMD display + NVIDIA compute).
# A placa NVIDIA RTX 3080 Ti opera exclusivamente como aceleradora de IA e computação (CUDA/CDI),
# enquanto a AMD Radeon RX 6600 XT é a GPU primária do desktop Wayland e das máquinas virtuais.
# A diretiva install ... /usr/bin/true impede qualquer tentativa de carregamento (inclusive por chamadas diretas do dracut).
blacklist nvidia-drm
blacklist nvidia_drm
install nvidia-drm /usr/bin/true
install nvidia_drm /usr/bin/true

# NVIDIA RTX 3080 Ti (headless compute): enable Resizable BAR (PAT is native in 620+ open driver)
options nvidia NVreg_EnableResizableBar=1
