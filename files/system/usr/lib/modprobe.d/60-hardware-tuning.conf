# Intel AX210 Wi-Fi 6E: disable power saving and U-APSD for deterministic low-latency AC operation
options iwlwifi power_save=0 uapsd_disable=1
options iwlmvm power_scheme=1

# NVIDIA RTX 3080 Ti (headless compute): enable PAT memory mapping and Resizable BAR
options nvidia NVreg_UsePageAttributeTable=1 NVreg_EnableResizableBar=1
