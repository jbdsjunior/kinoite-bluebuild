# =====================================================================
# KERNEL MODULES: Security Blacklist (CIS Linux Benchmark)
# =====================================================================

# Obsolete, insecure, and uncommon network protocols
install sctp /bin/false
install tipc /bin/false

# Legacy and uncommon file systems vulnerable to malformed superblock exploits
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false

# Obsolete Firewire driver
install firewire-core /bin/false
