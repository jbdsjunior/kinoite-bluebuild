# Include NSS configuration (altfiles), base sysusers tables, and quiet boot status
# in non-hostonly initramfs builds so early udevd/tmpfiles resolve system groups
# cleanly without emitting false errors during boot.
install_optional_items+=" /etc/nsswitch.conf /usr/lib/group /usr/lib/passwd /usr/lib/systemd/system.conf.d/60-kinoite-boot-quiet.conf "
