# =====================================================================
# KERNEL: CPU Behavior, Fault Resilience, and Security Hardening
# =====================================================================

# SECURITY: Restrict exposed kernel pointers in /proc to mitigate local privilege escalation (KSPP)
kernel.kptr_restrict = 1

# RESILIENCE: Clean automated reboot on panic/Oops to prevent frozen zombie states and Btrfs metadata corruption
kernel.panic = 10
kernel.panic_on_oops = 1

# RESILIENCE: Force panic on hard and soft lockups detected by NMI watchdog (ensures stack trace dump and auto-reboot)
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 1

# RESILIENCE: Enable emergency SysRq for safe disk sync, unmount, and reboot (Alt+SysRq+R-E-I-S-U-B)
kernel.sysrq = 1
