# =====================================================================
# KERNEL: CPU Behavior and Security Hardening
# =====================================================================


# SECURITY: Restrict kernel pointers in /proc
kernel.kptr_restrict = 1

# RESILIENCE: Automatic reboot on kernel panic, Oops, and lockups to prevent frozen zombie states and Btrfs corruption
kernel.panic = 10
kernel.panic_on_oops = 1
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 1

# RESILIENCE: Enable emergency SysRq for safe disk sync, unmount, and reboot (Alt+SysRq+R-E-I-S-U-B)
kernel.sysrq = 1

# SECURITY: Disable unprivileged line discipline autoloading (mitigate TIOCSETD exploits)
# Default in Fedora 44 (kernel 6.8+) is already 0; not redeclared per AGENTS.md §5
