# =====================================================================
# KERNEL: CPU Behavior and Security Hardening
# =====================================================================

# PERFORMANCE: Disable split-lock mitigation to reduce latency in heavy workloads
kernel.split_lock_mitigate = 0

# PERFORMANCE: Disable NMI watchdog to eliminate CPU jitter across 32 threads (Ryzen 9 5950X)
kernel.nmi_watchdog = 0

# SECURITY: Restrict kernel pointers in dmesg and /proc
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1

# SECURITY: Yama ptrace scope (ptrace restricted to direct child processes; IDE/debugger compatible)
kernel.yama.ptrace_scope = 1

# SECURITY: Restrict unprivileged eBPF (value 2 allows admin re-enabling at runtime without reboot)
kernel.unprivileged_bpf_disabled = 2

# SECURITY: Disable unprivileged line discipline autoloading (mitigate TIOCSETD exploits)
dev.tty.ldisc_autoload = 0

# SECURITY: Protected links, FIFOs, and regular file manipulation protection
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0
