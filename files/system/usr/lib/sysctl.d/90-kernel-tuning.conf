# =====================================================================
# KERNEL: CPU Behavior, Fault Resilience, and Security Hardening
# =====================================================================

# CONSOLE: Allow critical errors and warnings (KERN_WARNING=4) to reach console for crash visibility
kernel.printk = 4 4 1 7

# SECURITY: Restrict exposed kernel pointers in /proc to mitigate local privilege escalation (KSPP)
kernel.kptr_restrict = 1

# RESILIENCE: 20s window for drm_panic screen/QR-code scanning before automated reboot; dump tasks & printk buffer
kernel.panic = 20
kernel.panic_on_oops = 1
kernel.panic_print = 33

# RESILIENCE: NMI watchdog forces auto-reboot on true unrecoverable hard lockups; softlockup warns without crashing
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 0

# RESILIENCE: Enable emergency SysRq for safe disk sync, unmount, and reboot (Alt+SysRq+R-E-I-S-U-B)
kernel.sysrq = 1
