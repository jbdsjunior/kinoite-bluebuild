# Network tuning for workstation workloads
# BBR congestion control with FQ pacing for improved throughput under load

net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Socket buffer tuning for high-throughput scenarios
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 262144 134217728
net.ipv4.tcp_wmem = 4096 262144 134217728

# Connection queue tuning
net.core.somaxconn = 32768
net.ipv4.tcp_max_syn_backlog = 32768
net.core.netdev_max_backlog = 32768

# TCP behavior optimizations
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_mtu_probing = 1

# Memory and VM tuning for virtualization workloads
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 20
vm.dirty_background_ratio = 5
vm.overcommit_memory = 1
vm.overcommit_ratio = 80

# Kernel hardening (security)
kernel.unprivileged_bpf_disabled = 1
kernel.unprivileged_userns_clone = 0
kernel.kptr_restrict = 2
kernel.perf_event_paranoid = 3

# AMD-specific optimizations
kernel.numa_balancing = 1
