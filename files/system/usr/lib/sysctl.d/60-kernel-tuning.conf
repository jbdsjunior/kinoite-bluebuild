# Substitui o CUBIC (padrão) pelo BBR e o fq_codel pelo fq (melhor pacing)
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# Eleva os limites padrão do kernel para lidar com picos de streaming
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 1048576 33554432
net.ipv4.tcp_wmem = 4096 1048576 33554432

# Aumenta os limites de fila padrão (que costumam ser 4096)
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 8192

# Altera comportamentos padrão do Kernel focando em performance contínua
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_fastopen = 1
net.ipv4.tcp_mtu_probing = 1
