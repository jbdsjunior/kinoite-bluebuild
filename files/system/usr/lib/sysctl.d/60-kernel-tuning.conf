# SECURITY: BBR requires fq qdisc to prevent network saturation
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# FLOW_CONTROL: Scale TCP buffers for high-throughput media streaming
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 1048576 33554432
net.ipv4.tcp_wmem = 4096 1048576 33554432

# FLOW_CONTROL: Prevent throughput degradation on idle connections
net.ipv4.tcp_slow_start_after_idle = 0

# SECURITY: Accelerate socket recycling to prevent local port exhaustion
net.ipv4.tcp_fin_timeout = 15

# FLOW_CONTROL: Bypass path MTU blackholes
net.ipv4.tcp_mtu_probing = 1

# FLOW_CONTROL: Expand Chromium process/DOM isolation capacity for extreme tab counts
vm.max_map_count = 2097152
fs.file-max = 2097152
fs.inotify.max_user_watches = 1048576

# FLOW_CONTROL: Proactive memory reclaim to prevent allocation stalls on 64GB RAM
vm.watermark_scale_factor = 125

# FLOW_CONTROL: Minimize I/O latency spikes on NVMe by flushing dirty pages early
vm.dirty_background_ratio = 3
vm.dirty_ratio = 10

# FLOW_CONTROL: Retain dentry/inode caches in memory for faster Chromium asset retrieval
vm.vfs_cache_pressure = 50
