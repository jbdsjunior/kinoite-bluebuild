# ─────────────────────────────────────────────────────────────────────────────
# KERNEL TUNING - AAA GRADE FOR AMD RYZEN WORKSTATION (64GB RAM + NVMe)
# Target: Ryzen 9 5950X | RX 6600 XT | 64GB DDR4 | 1TB NVMe
# Standard: Universal Blue / Fedora Kinoite Best Practices
# ─────────────────────────────────────────────────────────────────────────────

# =============================================================================
# NETWORK STACK - Optimized for high-throughput, low-latency workloads
# Reference: Universal Blue, System76, Clear Linux
# =============================================================================

# Queue Discipline: FQ (Fair Queue) for optimal latency under load
# CUBIC congestion control for stability on high-bandwidth connections
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = cubic

# TCP/UDP Buffer Optimization - Critical for HTTP/3 (QUIC), WebRTC, streaming
# Max buffer sizes: 128MB (matches modern broadband/datacenter speeds)
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 262144 134217728
net.ipv4.tcp_wmem = 4096 262144 134217728
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# Connection Backlog - Handle massive concurrent connections (dev/containers)
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_notsent_lowat = 131072

# TCP Performance Tweaks
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fin_timeout = 10
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_max_tw_buckets = 262144
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_fack = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_mtu_probing = 1

# IPv6 Optimization (parity with IPv4)
net.ipv6.conf.all.accept_ra = 2
net.ipv6.conf.default.accept_ra = 2
net.ipv6.tcp_rmem = 4096 262144 134217728
net.ipv6.tcp_wmem = 4096 262144 134217728

# Network Security - Hardened defaults
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# =============================================================================
# MEMORY MANAGEMENT - Calibrated for 64GB RAM + ZRAM (zstd compression)
# Reference: Universal Blue zram defaults, GNOME OS memory policies
# =============================================================================

# Swappiness: Aggressive but balanced - ZRAM makes swap cheap
# With zstd compression, compressed pages are faster than disk I/O
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.watermark_scale_factor = 1000

# Dirty Page Writeback - Prevent micro-stutters on NVMe
# Absolute byte values prevent issues with varying RAM sizes
vm.dirty_background_bytes = 134217728
vm.dirty_bytes = 536870912
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 500

# Overcommit Strategy - Conservative for stability
vm.overcommit_memory = 2
vm.overcommit_ratio = 80
vm.min_free_kbytes = 131072

# Transparent Huge Pages - Enabled for AMD Zen architecture
# Zen benefits from THP due to large L3 cache and memory controller design
vm.compaction_proactiveness = 20
vm.mmap_min_addr = 65536

# =============================================================================
# FILESYSTEM & I/O - NVMe optimization for BTRFS (default on Kinoite)
# Reference: Fedora BTRFS guidelines, Phoronix NVMe benchmarks
# =============================================================================

# Inotify Watchers - Critical for IDEs, file sync, containers
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192
fs.inotify.max_queued_events = 1048576

# File Descriptor Limits - Development workstation baseline
fs.file-max = 2097152
fs.nr_open = 1048576

# AIO - Async I/O for databases, containers, VMs
fs.aio-max-nr = 1048576

# =============================================================================
# KERNEL SECURITY & STABILITY - Production-grade hardening
# Reference: CIS Benchmarks, Fedora Security Guidelines
# =============================================================================

# Core dumps - Disabled by default (enable per-service if needed)
fs.suid_dumpable = 0

# Kernel pointer exposure - Hide from unprivileged users
kernel.kptr_restrict = 2
kernel.perf_event_paranoid = 3

# Sysrq - Minimal functionality for safety
kernel.sysrq = 16

# Panic handling - Auto-reboot after 10 seconds on kernel panic
kernel.panic = 10
kernel.panic_on_oops = 1

# ASLR - Full randomization enabled
kernel.randomize_va_space = 2

# Watchdog - Detect hard lockups
kernel.watchdog = 1
kernel.watchdog_thresh = 10

# =============================================================================
# AMD-SPECIFIC OPTIMIZATIONS - Zen architecture tuning
# Reference: AMD P-State driver documentation, Phoronix Zen benchmarks
# =============================================================================

# CPU Frequency Scaling - Prefer performance under load
# (Complemented by amd_pstate=active karg)
kernel.nmi_watchdog = 0

# NUMA balancing - Enable for multi-die Ryzen CPUs
kernel.numa_balancing = 1

# =============================================================================
# END OF KERNEL TUNING
# Validation: sysctl -p /usr/lib/sysctl.d/60-kernel-tuning.conf
# ─────────────────────────────────────────────────────────────────────────────
