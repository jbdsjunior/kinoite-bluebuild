# ── Rede: Otimização Limpa (TCP & QUIC para navegação pesada) ──
# Mantém CUBIC para estabilidade absoluta nas IRQs e FQ para disciplina de tráfego
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = cubic

# Teto de buffers para TCP e UDP (O Brave usa muito UDP via HTTP/3 / QUIC)
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 1048576 33554432
net.ipv4.tcp_wmem = 4096 1048576 33554432

# Gestão de filas para aguentar rajadas de centenas de conexões simultâneas
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fin_timeout = 15

# ── VM / Memória: Calibrado para 64 GB RAM + ZRAM + NVMe ──
# Com ZRAM, swappiness alto é OBRIGATÓRIO para compactar páginas inativas na RAM
vm.swappiness = 100
vm.vfs_cache_pressure = 50

# Prevenção de "micro-stutters" em discos NVMe limitando o cache sujo em BYTES (não %)
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# ── Sistema / IDEs / Watchers ──
# max_user_watches já é 524288 por padrão no Fedora, aumentamos apenas as instâncias
fs.inotify.max_user_instances = 8192
