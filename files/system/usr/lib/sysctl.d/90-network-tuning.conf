# =====================================================================
# NETWORK: TCP/IP Tuning, Buffer Scaling, and Security Hardening
# =====================================================================

# SECURITY/PERFORMANCE: BBR congestion control paired with fair queueing (fq)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# FLOW_CONTROL: Buffer scaling for high-bandwidth media streaming (up to 32MB)
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 1048576 33554432
net.ipv4.tcp_wmem = 4096 1048576 33554432

# FLOW_CONTROL: Maintain CWND on idle connections to prevent latency spikes
net.ipv4.tcp_slow_start_after_idle = 0

# PERFORMANCE: Accelerated socket recycling to mitigate port exhaustion
net.ipv4.tcp_fin_timeout = 15

# FLOW_CONTROL: MTU probing to bypass ICMP blackholes
net.ipv4.tcp_mtu_probing = 1

# PRIVACY: IPv6 Privacy Extensions (RFC 4941)
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# SECURITY: SYN flood mitigation
net.ipv4.tcp_syncookies = 1

# SECURITY: TIME-WAIT assassination hazard protection (RFC 1337)
net.ipv4.tcp_rfc1337 = 1

# SECURITY: Reverse Path Filtering loose mode (anti-IP spoofing compatible with Tailscale, VPNs, Podman, and KVM bridges)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# SECURITY: Reject and disable ICMP redirects (mitigate MITM routing attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# SECURITY: Ignore ICMP echo broadcast requests (mitigate Smurf amplification attacks)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# SECURITY: Reject source-routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# ROUTING: IP packet forwarding for Podman container bridges, KVM/libvirt, and Tailscale
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# ROUTING/SLAAC: Retain IPv6 router advertisements and default gateway when forwarding is enabled (RFC 4862)
net.ipv6.conf.all.accept_ra = 2
net.ipv6.conf.default.accept_ra = 2
