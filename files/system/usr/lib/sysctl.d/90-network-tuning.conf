# =====================================================================
# NETWORK: TCP/IP Tuning, Buffer Scaling, and Security Hardening
# =====================================================================

# CONGESTION CONTROL: Google BBR pacing paired with Fair Queueing (FQ) to minimize bufferbloat and WAN/Wi-Fi latency
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# BUFFER SCALING: High-bandwidth delay product (BDP) buffer ceiling up to 32MB for gigabit WAN/VPN/cloud transfers
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 16384 33554432

# FLOW CONTROL: Preserve congestion window (CWND) across idle connections to eliminate latency spikes in HTTP/2 and SSH
net.ipv4.tcp_slow_start_after_idle = 0

# PERFORMANCE: Fast socket recycling in FIN-WAIT-2 state (15s timeout) to prevent port exhaustion during container churn
net.ipv4.tcp_fin_timeout = 15

# RESILIENCE: Automatic Path MTU blackhole probing for transparent traversal of WireGuard and Tailscale VPN tunnels
net.ipv4.tcp_mtu_probing = 1

# SECURITY: Protect against TCP TIME-WAIT assassination hazards (RFC 1337)
net.ipv4.tcp_rfc1337 = 1

# SECURITY: Reject and disable ICMP redirects across all interfaces to mitigate MitM route tampering (CIS Benchmark)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

