# =====================================================================
# NETWORK: Otimização de TCP/IP, Buffers e Controle de Congestionamento
# =====================================================================

# SECURITY/PERFORMANCE: BBR requer fq qdisc para prevenir saturação de rede
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# FLOW_CONTROL: Escala buffers TCP para streaming de mídia de alto rendimento (32MB)
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 1048576 33554432
net.ipv4.tcp_wmem = 4096 1048576 33554432

# FLOW_CONTROL: Previne degradação de throughput em conexões inativas
net.ipv4.tcp_slow_start_after_idle = 0

# SECURITY/PERFORMANCE: Acelera a reciclagem de sockets para evitar exaustão de portas
net.ipv4.tcp_fin_timeout = 15

# FLOW_CONTROL: Contorna blackholes de MTU
net.ipv4.tcp_mtu_probing = 1

# PRIVACY: Configuração de endereços IPv6 temporários (Privacy Extensions)
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2