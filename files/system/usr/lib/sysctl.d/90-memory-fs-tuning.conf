# =====================================================================
# MEMORY & FILE SYSTEM: VFS, Inotify, and Memory Management Tuning
# =====================================================================

# FILESYSTEM: Inotify limits for IDEs, build watchers, and containers
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288

# MEMORY: Proactive memory reclamation to prevent memory pressure spikes on 64GB RAM
vm.watermark_scale_factor = 125

# I/O FLOW: Smooth background dirty page flushing for NVMe storage
vm.dirty_background_ratio = 3
vm.dirty_ratio = 10

# CACHE: Retain dentry and inode caches in RAM for rapid file access
vm.vfs_cache_pressure = 50

# ZRAM OPTIMIZATION: High swappiness for zstd compressed zram0 swap before pagecache eviction
vm.swappiness = 150

# ZRAM OPTIMIZATION: Disable page clustering (ZRAM is random-access RAM, not rotating disk)
vm.page-cluster = 0
