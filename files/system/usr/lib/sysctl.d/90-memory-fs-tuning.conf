# =====================================================================
# MEMORY & FILE SYSTEM: Ajustes de VFS, Inotify e Gerenciamento de RAM
# =====================================================================

# FLOW_CONTROL: Expande a capacidade de mapeamento de memória
# (Útil para jogos/Steam e muitas abas no Chromium)
vm.max_map_count = 2147483642

# FLOW_CONTROL: Aumenta o limite global de descritores de arquivos
fs.file-max = 2097152

# FILESYSTEM: Ajustes de inotify para IDEs, ferramentas de build e sincronização
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288

# FLOW_CONTROL: Reivindicação proativa de memória para evitar travamentos (Ideal para +16GB RAM)
vm.watermark_scale_factor = 125

# FLOW_CONTROL: Minimiza picos de latência de I/O em NVMe escrevendo blocos sujos no disco mais cedo
vm.dirty_background_ratio = 3
vm.dirty_ratio = 10

# FLOW_CONTROL: Mantém caches de dentry/inode na memória para recuperação rápida de assets
vm.vfs_cache_pressure = 50