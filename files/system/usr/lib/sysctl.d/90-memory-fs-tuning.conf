# =====================================================================
# MEMORY & FILE SYSTEM: VFS, Inotify, NVMe Anti-Stutter, and ZRAM
# =====================================================================

# FILESYSTEM: Prevent ENOSPC errors on file watchers across IDEs (VS Code), Podman containers, and dev tooling
fs.inotify.max_user_instances = 8192

# MEMORY: Proactive kswapd wake-up (1.25% headroom on 64GB RAM) to eliminate direct-reclaim stalls during memory bursts
vm.watermark_scale_factor = 125

# I/O FLOW: Early, continuous background dirty page flushing for NVMe Gen4 (prevents UI/mouse stutters from 12GB+ bursts)
vm.dirty_background_ratio = 3
vm.dirty_ratio = 10

# CACHE: Retain dentry and inode metadata in RAM for near-instant git status, find, and directory traversal
vm.vfs_cache_pressure = 50

# ZRAM OPTIMIZATION: Proactive anonymous compaction into zstd-compressed in-RAM ZRAM swap, freeing physical RAM for pagecache
vm.swappiness = 150

# ZRAM OPTIMIZATION: Disable multi-page sequential readahead clustering (saves CPU decompression on random-access ZRAM)
vm.page-cluster = 0
