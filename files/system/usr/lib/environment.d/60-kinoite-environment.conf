# =====================================================================
# SYSTEMD USER ENVIRONMENT: Workstation GPU & Tooling Configuration
# =====================================================================

# AMD ROCm / HIP compatibility override for Navi 23 / RX 6600 XT (gfx1032 -> gfx1030)
HSA_OVERRIDE_GFX_VERSION=10.3.0

# Prefer open-source Mesa RADV Vulkan driver
AMD_VULKAN_ICD=RADV

# Standardize 24-bit truecolor support across terminal emulators
COLORTERM=truecolor

# User session text editor and pager synchronization
EDITOR=nano
VISUAL=nano
SUDO_EDITOR=nano
PAGER=less
LESS=-R

# FreeType stem darkening for crisp, macOS-equivalent typography
FREETYPE_PROPERTIES="cff:no-stem-darkening=0 autofitter:no-stem-darkening=0"

# Native Wayland execution for Electron applications (eliminates fractional scaling blur)
ELECTRON_OZONE_PLATFORM_HINT=auto
