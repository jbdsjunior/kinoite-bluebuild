[Unit]
Description=Podman auto-update timer (user session)
Documentation=man:podman-auto-update(1) man:systemd.timer(5)

[Timer]
OnBootSec=
OnUnitActiveSec=
OnUnitInactiveSec=
OnCalendar=
OnBootSec=5m
OnUnitActiveSec=1h
RandomizedDelaySec=0
AccuracySec=1m
Persistent=true

[Install]
WantedBy=timers.target
