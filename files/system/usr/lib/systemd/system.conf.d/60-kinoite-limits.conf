# =====================================================================
# SYSTEMD MANAGER LIMITS: Unified Memory Locking for Local AI / LLMs
# =====================================================================
# Raises RLIMIT_MEMLOCK from default 8 MiB (8388608) to infinity so
# llama.cpp (--mlock), llamafile, ROCm/HSA (/dev/kfd), and Vulkan RADV
# can pin multi-gigabyte GGUF model weights in 64 GB RAM without ENOMEM.

[Manager]
DefaultLimitMEMLOCK=infinity
