# =====================================================================
# SYSTEMD MANAGER: Clean and Silent Boot Status Configuration
# =====================================================================
# In default 'auto' mode (under kernel 'quiet'), systemd exposes the
# virtual console buffer and displays progress status [ OK ] and animated
# start jobs '[ *** ]' whenever any unit takes time or DRM switches.
#
# Setting ShowStatus=error guarantees a clean, silent Plymouth boot
# during normal startup, while preserving immediate console visibility
# if any unit genuinely fails with [FAILED].
# =====================================================================

[Manager]
ShowStatus=error
