[Unit]
Description=Staged Update Timer
Documentation=man:systemd.timer(5)

[Timer]
# Reset upstream bootc timer triggers (upstream defaults to OnBootSec=1h /
# OnUnitInactiveSec=8h). Keep a deterministic, single-workstation cadence:
# never pull a full image on every boot, but do not hammer the registry either.
OnBootSec=
OnUnitActiveSec=
OnUnitInactiveSec=
OnCalendar=
RandomizedDelaySec=
Persistent=false
OnBootSec=1h
OnUnitInactiveSec=8h
AccuracySec=1h
