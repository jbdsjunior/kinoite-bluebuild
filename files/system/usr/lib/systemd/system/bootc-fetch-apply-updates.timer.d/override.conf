[Unit]
Description=Staged Update Timer
Documentation=man:systemd.timer(5)

[Timer]
Unit=bootc-fetch-apply-updates.service
# Reset base upstream timer triggers
OnBootSec=
OnUnitActiveSec=
OnUnitInactiveSec=
OnCalendar=
OnBootSec=5m
OnUnitActiveSec=45m
RandomizedDelaySec=0
AccuracySec=1s
Persistent=true

[Install]
WantedBy=timers.target
