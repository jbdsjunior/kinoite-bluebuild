[Unit]
Description=Staged Update Timer
Documentation=man:systemd.timer(5)

[Timer]
Unit=bootc-fetch-apply-updates.service
# Reset base upstream timer triggers
OnBootSec=
OnUnitActiveSec=
OnUnitInactiveSec=
OnCalendar=
OnBootSec=5m
OnUnitActiveSec=1h
RandomizedDelaySec=5m
AccuracySec=1m
Persistent=true

[Install]
WantedBy=timers.target
