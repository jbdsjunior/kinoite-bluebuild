[Unit]
Description=Staged Update Timer
Documentation=man:systemd.timer(5)
# Removido ConditionACPower daqui para garantir que o timer inicie junto com o sistema, independente de como ele foi ligado.

[Timer]
Unit=bootc-fetch-apply-updates.service
OnBootSec=15m
OnUnitActiveSec=24h
RandomizedDelaySec=1h
AccuracySec=5m
Persistent=true

[Install]
WantedBy=timers.target