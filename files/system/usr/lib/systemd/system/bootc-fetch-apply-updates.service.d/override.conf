[Unit]
Description=Bootc Staged Update Service
Documentation=man:bootc(8)
Wants=network-online.target
After=network-online.target
ConditionACPower=true

[Service]
Type=oneshot
# Skip automatic update if NetworkManager reports connection is metered, offline, captive portal, or limited
ExecCondition=/usr/libexec/kinoite/network-guard
ExecStart=
ExecStart=/usr/bin/bootc update --quiet

Nice=19
CPUSchedulingPolicy=idle
IOSchedulingClass=idle
