[Unit]
Description=Bootc Staged Update Service
Documentation=man:bootc(8)
Wants=network-online.target
After=network-online.target
# Mantemos aqui: se o timer disparar na bateria, o serviço simplesmente pula a execução.
ConditionACPower=true

[Service]
Type=oneshot
ExecStart=
ExecStart=/usr/bin/bootc update --quiet

# Executa em prioridade mínima para não causar "engasgos" enquanto você usa o PC
Nice=19
CPUSchedulingPolicy=idle
IOSchedulingClass=idle