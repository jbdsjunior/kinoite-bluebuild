[Unit]
Description=Bootc Staged Update Service
Documentation=man:bootc(8)
Wants=network-online.target
After=network-online.target
ConditionACPower=true

[Service]
Type=oneshot
# Skip automatic update if NetworkManager reports connection is metered, offline, captive portal, or limited
ExecCondition=/bin/bash -c 'm=$(/usr/bin/busctl --system get-property org.freedesktop.NetworkManager /org/freedesktop/NetworkManager org.freedesktop.NetworkManager Metered 2>/dev/null || true); c=$(/usr/bin/busctl --system get-property org.freedesktop.NetworkManager /org/freedesktop/NetworkManager org.freedesktop.NetworkManager Connectivity 2>/dev/null || true); [[ "$m" != *" 1" && "$m" != *" 3" && "$c" != *" 1" && "$c" != *" 2" && "$c" != *" 3" ]]'
ExecStart=
ExecStart=/usr/bin/bootc update --quiet

Nice=19
CPUSchedulingPolicy=idle
IOSchedulingClass=idle
