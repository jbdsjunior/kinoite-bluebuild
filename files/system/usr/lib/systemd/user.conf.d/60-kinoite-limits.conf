# =====================================================================
# SYSTEMD USER MANAGER LIMITS: Unified Memory Locking for Local AI / LLMs
# =====================================================================
# Raises RLIMIT_MEMLOCK from default 8 MiB (8388608) to infinity for user
# sessions, terminals, and rootless Podman containers (llamafile, GGUF, ROCm).

[Manager]
DefaultLimitMEMLOCK=infinity
