# =====================================================================
# SYSTEMD-JOURNALD: Crash Resilience & Fast NVMe Flushing
# =====================================================================

[Journal]
# Reduce sync interval from 5m to 30s to prevent log loss on sudden hardware reset
SyncIntervalSec=30s

# Ensure robust persistence and compression on NVMe Gen4 (Btrfs)
Storage=persistent
Compress=yes
