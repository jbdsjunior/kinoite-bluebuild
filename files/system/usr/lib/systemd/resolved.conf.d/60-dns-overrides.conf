# =====================================================================
# SYSTEMD-RESOLVED: Workstation defaults
# =====================================================================
# DNS servers are intentionally NOT pinned in the image: hardcoding a
# third-party resolver (with DNSOverTLS/DNSSEC trade-offs) breaks VPNs,
# captive portals and split-DNS setups. Configure it per host instead
# (see docs/POST_INSTALL.md, "DNS privado com DoT").

[Resolve]
# Resolve .local hostnames via mDNS (printers, NAS, Home Assistant)
MulticastDNS=resolve
LLMNR=no
