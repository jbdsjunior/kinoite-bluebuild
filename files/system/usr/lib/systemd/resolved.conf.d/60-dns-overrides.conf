[Resolve]

# Reset upstream DNS servers before assigning overrides
DNS=
# (Cloudflare)
DNS=1.1.1.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com
# FallbackDNS=
# FallbackDNS=1.0.0.1#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com

# (Quad9)
# DNS=9.9.9.10#dns10.quad9.net 2620:fe::10#dns10.quad9.net
# FallbackDNS=149.112.112.10#dns10.quad9.net 2620:fe::fe:10#dns10.quad9.net

DNSOverTLS=opportunistic
DNSSEC=allow-downgrade

MulticastDNS=resolve
LLMNR=no
Cache=yes
CacheFromLocalhost=no
