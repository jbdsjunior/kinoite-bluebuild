[Resolve]
# Primary DNS: Control D (p2 / Block Malware + Ads + Trackers) with DNS-over-TLS (DoT)
# Control D FreeDNS uses dedicated .11 anycast addresses for port 853 DoT listeners
DNS=76.76.2.11#p2.freedns.controld.com 76.76.10.11#p2.freedns.controld.com 2606:1a40::11#p2.freedns.controld.com 2606:1a40:1::11#p2.freedns.controld.com

# Fallback DNS: Cloudflare with DNS-over-TLS (DoT)
FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com

# Enforce strict TLS (prevents cleartext downgrades)
DNSOverTLS=yes

# DNSSEC must be 'no' when using adblocking resolvers (Control D p2 blocks domains via synthetic answers, which breaks DNSSEC signatures and causes systemd-resolved degraded feature loops)
DNSSEC=no

MulticastDNS=resolve
LLMNR=no

