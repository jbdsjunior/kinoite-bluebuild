# Ensure declarative system sysctls are registered in /etc/sysctl.d
# This guarantees TuneD's reapply_sysctl honors project tuning (ZRAM 150, NVMe dirty ratios, lockup panics)
# across all power profiles (Balanced, Performance, Power Saver) without configuration drift.
L+ /etc/sysctl.d/90-kernel-tuning.conf - - - - /usr/lib/sysctl.d/90-kernel-tuning.conf
L+ /etc/sysctl.d/90-memory-fs-tuning.conf - - - - /usr/lib/sysctl.d/90-memory-fs-tuning.conf
L+ /etc/sysctl.d/90-network-tuning.conf - - - - /usr/lib/sysctl.d/90-network-tuning.conf
