# KVM/Libvirt system-wide VM images - NoCOW for BTRFS
d /var/lib/libvirt/images 0755 root root -
h /var/lib/libvirt/images - - - - +C

# System-wide container storage (Podman) - NoCOW for BTRFS
d /var/lib/containers/storage 0711 root root -
h /var/lib/containers/storage - - - - +C
d /var/lib/containers/storage/volumes 0755 root root -
h /var/lib/containers/storage/volumes - - - - +C

# Cosmopolitan / llamafile dynamic linker helper copy (avoids SELinux ld_so_t execmod denial)
C+ /var/tmp/cosmo-ld-linux.bin 0755 root root - /usr/lib64/ld-linux-x86-64.so.2

