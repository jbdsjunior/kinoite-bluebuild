# Declarative Bluetooth Policy for WirePlumber 0.5
# Enforces highest audio fidelity codecs (LDAC > AAC > SBC-XQ > SBC)
# and prevents involuntary degradation to low-quality mono headset profile (HSP/HFP).
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.codecs = [ "ldac" "aac" "sbc_xq" "sbc" ]
}

# LDAC quality is a device property (pipewire-props(7)): must be applied via rules
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.a2dp.ldac.quality = "auto"
      }
    }
  },
  # Hardware volume quirk: Tribit portable speakers (Tribit XSound Go / StormBox / etc.)
  # Workaround for Actions Semiconductor (VID 10D6) AVRCP 1.4+ Absolute Volume handshake lag
  # and volume slider snap-back / rubber-banding bug.
  # Explicitly disables hardware volume exclusively for Tribit devices, delegating attenuation
  # to PipeWire 32-bit float software PCM without impacting TWS earbuds (Baseus EP10 Pro).
  {
    matches = [
      {
        device.name = "~bluez_card.*[Tt]ribit.*"
      },
      {
        device.name = "~bluez_card.*"
        device.description = "~.*[Tt]ribit.*"
      },
      {
        device.name = "~bluez_card.*"
        device.alias = "~.*[Tt]ribit.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.enable-hw-volume = false
        bluez5.hw-volume = [ ]
      }
    }
  }
]
