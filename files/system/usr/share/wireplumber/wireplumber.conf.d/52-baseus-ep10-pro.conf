# Baseus Bass EP10 Pro hardware volume quirk
# Disables broken 16-step DAC quantization cliff (abrupt volume drop around 11-12%)
# and delegates attenuation to PipeWire 32-bit floating-point software mixer.
monitor.bluez.rules = [
  {
    matches = [
      {
        "device.name" = "~bluez_card.*79_06_BF_5C_9F_CE.*"
      },
      {
        "device.description" = "~.*EP10 Pro.*"
      },
      {
        "device.alias" = "~.*EP10 Pro.*"
      }
    ]
    actions = {
      update-props = {
        "bluez5.hw-volume" = [ ]
      }
    }
  }
]
