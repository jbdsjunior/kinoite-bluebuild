# =====================================================================
# WIREPLUMBER: Surgical AVRCP Volume Quirk for Tribit XSound Go
# =====================================================================
# Actions Semiconductor SoC (usb:v10D6pB009) in Tribit XSound Go exhibits
# delayed AVRCP Absolute Volume responses that snap back the KDE volume slider.
# Upstream PipeWire (bluez-hardware.conf #pipewire-1592) disables hw-volume for
# Tribit MAXSound Plus; this rule extends the exact fix to Tribit XSound Go
# while keeping upstream native defaults for all other Bluetooth devices (TWS).

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
        device.description = "~.*Tribit XSound Go.*"
      },
      {
        device.name = "~bluez_card.*"
        device.product.id = "0xb009"
      }
    ]
    actions = {
      update-props = {
        bluez5.enable-hw-volume = false
      }
    }
  }
]
