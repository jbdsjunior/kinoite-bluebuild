# ── GPU / Rendering (RX 6600 XT / RDNA2) ──
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--enable-features=VaapiVideoDecoder,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,VaapiIgnoreDriverChecks,UseMultiPlaneFormatForHardwareVideo

# ── Performance para muitas abas ──
--enable-features=ParallelDownloading,BackgroundNetworking,MemoryPressureMultiplier
--max-active-webgl-contexts=32
--renderer-process-limit=100
--js-flags=--max-old-space-size=8192
--disable-renderer-backgrounding
--disable-background-timer-throttling
--disable-backgrounding-occluded-windows

# ── Privacidade / Debloat ──
--disable-breakpad
--no-pings
--disable-domain-reliability
--disable-features=OptimizationHints,OptimizationGuideModelDownloading,OptimizationGuideFetching
