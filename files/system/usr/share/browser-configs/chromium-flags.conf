# Critical flow: Wayland native execution
--ozone-platform=wayland

# Security/Stability: zero-copy and explicit GL overrides removed to prevent surface allocation failures on AMD Mesa drivers
--ignore-gpu-blocklist
--enable-gpu-rasterization

# Hardware video decoding and Wayland screen capture
--enable-features=VaapiVideoDecoder,WebRTCPipeWireCapturer,ParallelDownloading

# Telemetry reduction
--disable-breakpad
--no-pings
--disable-domain-reliability
--disable-features=Translate,OptimizationHints,MediaRouter,CloudImportClient
