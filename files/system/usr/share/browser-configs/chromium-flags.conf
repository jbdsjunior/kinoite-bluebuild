# Critical flow: Wayland native execution with fallback resilience
--ozone-platform-hint=auto

# Security/Stability: zero-copy and explicit GL overrides removed to prevent surface allocation failures on AMD Mesa drivers
--ignore-gpu-blocklist
--enable-gpu-rasterization

# Hardware video decoding (VA-API on AMD RX 6600 XT) and Wayland screen capture
--enable-features=VaapiVideoDecoder,AcceleratedVideoDecodeLinuxGL,VaapiIgnoreDriverChecks,WebRTCPipeWireCapturer,ParallelDownloading


# Telemetry reduction
--disable-breakpad
--no-pings
--disable-domain-reliability
--disable-features=Translate,OptimizationHints,MediaRouter,CloudImportClient
