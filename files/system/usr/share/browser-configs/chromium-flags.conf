--enable-features=VaapiVideoDecoder,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,VaapiIgnoreDriverChecks,UseMultiPlaneFormatForHardwareVideo,WebRTCPipeWireCapturer,UseOzonePlatform

# GPU acceleration flags
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--enable-webgl
--enable-webgl2

# Privacy and telemetry reduction
--disable-breakpad
--no-pings
--disable-domain-reliability
--disable-features=Translate,OptimizationHints,MediaRouter,CloudImportClient

# Performance optimizations
--enable-parallel-downloading
--num-raster-threads=4
