# Critical flow: Wayland native execution with fallback resilience
--ozone-platform-hint=auto

# Performance and smooth rendering
--enable-gpu-rasterization
--enable-smooth-scrolling

# Wayland screen capture and performance
--enable-features=WebRTCPipeWireCapturer,ParallelDownloading

# Telemetry reduction
--disable-breakpad
--no-pings
--disable-domain-reliability
--disable-features=Translate,OptimizationHints,MediaRouter,CloudImportClient
