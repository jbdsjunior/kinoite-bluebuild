# Critical flow: Wayland native execution with fallback resilience
--ozone-platform-hint=auto

# Performance and smooth rendering
--enable-gpu-rasterization
--enable-smooth-scrolling

# Wayland screen capture, performance, and hardware video decode/encode (VA-API zero-copy GL)
--enable-features=WebRTCPipeWireCapturer,ParallelDownloading,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder

# Telemetry reduction
--disable-breakpad
--no-pings
--disable-domain-reliability
--disable-features=Translate,OptimizationHints,MediaRouter,CloudImportClient
