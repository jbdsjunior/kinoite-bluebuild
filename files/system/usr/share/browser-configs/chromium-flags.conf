# =====================================================================
# KERNEL, VA-API & MEDIA: Browser flags applied to Chromium-based Flatpaks
# =====================================================================
# Only deviations from the current upstream defaults are kept here.
# (--enable-gpu-rasterization, --enable-zero-copy and --enable-smooth-scrolling
# are already the default on modern Chromium builds.)

# Native Wayland execution on KDE Plasma 6
--ozone-platform=wayland

# Force GPU hardware acceleration on Mesa RADV (bypasses Chromium Linux software fallback)
--ignore-gpu-blocklist
--enable-gpu-rasterization

# Hardware video decode (VA-API) on Mesa RADV
--enable-features=VaapiIgnoreDriverChecks,AcceleratedVideoEncoder,WaylandOverlayDelegation,WaylandTextInputV3,WebRtcPipeWireCamera

# Telemetry and background bloat reduction
--disable-breakpad
--no-pings
--disable-domain-reliability
--disable-features=Translate,OptimizationHints,MediaRouter
