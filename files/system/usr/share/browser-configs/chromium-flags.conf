# Native Wayland execution on KDE Plasma 6
--ozone-platform=wayland

# AMD Radeon RX 6600 XT GPU rasterization & zero-copy DMA-BUF texture upload
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--enable-smooth-scrolling

# Hardware VA-API video encode/decode, KWin Wayland overlay delegation & PipeWire zero-copy
--enable-features=VaapiIgnoreDriverChecks,AcceleratedVideoEncoder,UiGpuRasterization,WaylandOverlayDelegation,WaylandTextInputV3,ZeroCopyDesktopCapture,WebRtcPipeWireCamera,ParallelDownloading

# Telemetry and background bloat reduction
--disable-breakpad
--no-pings
--disable-domain-reliability
--disable-features=Translate,OptimizationHints,MediaRouter
