# Ensure user rclone directories and cloud mount paths exist
d %h/.config 0755 - - -
d %h/.config/rclone 0700 - - -
d %h/.config/rclone/env 0700 - - -
d %h/Cloud 0755 - - -

# Declaratively enforce authoritative default environment configurations on boot
r! %h/.config/rclone/env/GoogleDrive.env - - - - -
r! %h/.config/rclone/env/OneDrive.env - - - - -
C+ %h/.config/rclone/env/GoogleDrive.env 0600 - - - /usr/share/rclone/env/GoogleDrive.env
C+ %h/.config/rclone/env/OneDrive.env 0600 - - - /usr/share/rclone/env/OneDrive.env
