# Browser flags configuration - systemd-tmpfiles for user space
# Creates symlinks from read-only image config to user's Flatpak config directories

# Brave browser flags symlink
L+ %h/.var/app/com.brave.Browser/config/brave-flags.conf - - - - /usr/share/browser-configs/brave-flags.conf

# Chrome browser flags symlink
L+ %h/.var/app/com.google.Chrome/config/chrome-flags.conf - - - - /usr/share/browser-configs/chrome-flags.conf

# Ensure config directories exist before symlinking
d %h/.var/app/com.brave.Browser/config 0755 - - -
d %h/.var/app/com.google.Chrome/config 0755 - - -
