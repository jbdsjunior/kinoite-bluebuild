# Ensure destination directories exist before copying configuration files
d %h/.var/app/com.brave.Browser/config 0755 - - -
# d %h/.var/app/com.google.Chrome/config 0755 - - -
# d %h/.var/app/org.chromium.Chromium/config 0755 - - -
# d %h/.var/app/com.microsoft.Edge/config 0755 - - -
d %h/.config 0755 - - -

# Flatpak browsers (authoritatively enforced on boot)
r! %h/.var/app/com.brave.Browser/config/brave-flags.conf - - - - -
C+ %h/.var/app/com.brave.Browser/config/brave-flags.conf - - - - /usr/share/browser-configs/chromium-flags.conf
# r! %h/.var/app/com.google.Chrome/config/chrome-flags.conf - - - - -
# C+ %h/.var/app/com.google.Chrome/config/chrome-flags.conf - - - - /usr/share/browser-configs/chromium-flags.conf
# r! %h/.var/app/org.chromium.Chromium/config/chromium-flags.conf - - - - -
# C+ %h/.var/app/org.chromium.Chromium/config/chromium-flags.conf - - - - /usr/share/browser-configs/chromium-flags.conf
# r! %h/.var/app/com.microsoft.Edge/config/edge-flags.conf - - - - -
# C+ %h/.var/app/com.microsoft.Edge/config/edge-flags.conf - - - - /usr/share/browser-configs/chromium-flags.conf

# Host / native browsers (uncomment if installed directly on host or via layered RPM)
# r! %h/.config/brave-flags.conf - - - - -
# C+ %h/.config/brave-flags.conf - - - - /usr/share/browser-configs/chromium-flags.conf
# r! %h/.config/chrome-flags.conf - - - - -
# C+ %h/.config/chrome-flags.conf - - - - /usr/share/browser-configs/chromium-flags.conf
# r! %h/.config/chromium-flags.conf - - - - -
# C+ %h/.config/chromium-flags.conf - - - - /usr/share/browser-configs/chromium-flags.conf
# r! %h/.config/edge-flags.conf - - - - -
# C+ %h/.config/edge-flags.conf - - - - /usr/share/browser-configs/chromium-flags.conf
