# KVM/Libvirt and GNOME Boxes user VM images (NoCOW on BTRFS)
d %h/.local/share/libvirt 0755 - - -
d %h/.local/share/libvirt/images 0755 - - -
h %h/.local/share/libvirt/images - - - - +C
d %h/.local/share/gnome-boxes 0755 - - -
d %h/.local/share/gnome-boxes/images 0755 - - -
h %h/.local/share/gnome-boxes/images - - - - +C

# User container storage for Podman and Distrobox (NoCOW on BTRFS)
d %h/.local/share/containers 0700 - - -
d %h/.local/share/containers/storage 0700 - - -
h %h/.local/share/containers/storage - - - - +C
d %h/.local/share/containers/storage/volumes 0700 - - -
h %h/.local/share/containers/storage/volumes - - - - +C

# Rclone VFS cache (NoCOW on BTRFS)
d %h/.cache 0755 - - -
d %h/.cache/rclone 0755 - - -
h %h/.cache/rclone - - - - +C

# Local LLM models cache and weights (NoCOW on BTRFS for multi-GB tensors)
d %h/.ollama 0700 - - -
d %h/.ollama/models 0700 - - -
h %h/.ollama/models - - - - +C
d %h/.cache/huggingface 0700 - - -
h %h/.cache/huggingface - - - - +C
