# Ensure standard ASCII XDG user directories exist in user home
d %h/Desktop 0755 - - -
d %h/Documents 0755 - - -
d %h/Downloads 0755 - - -
d %h/Music 0755 - - -
d %h/Pictures 0755 - - -
d %h/Public 0755 - - -
d %h/Templates 0755 - - -
d %h/Videos 0755 - - -
d %h/Projects 0755 - - -
d %h/Models 0755 - - -
d %h/AppImages 0755 - - -

# XDG Base Directory specification compliance
d %h/.local/bin 0755 - - -
d %h/.local/state 0700 - - -
