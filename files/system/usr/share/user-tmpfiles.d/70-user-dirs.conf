# Ensure standard ASCII user directories exist in user home
d %h/Desktop 0755 - - -
d %h/Documents 0755 - - -
d %h/Downloads 0755 - - -
d %h/Music 0755 - - -
d %h/Pictures 0755 - - -
d %h/Public 0755 - - -
d %h/Templates 0755 - - -
d %h/Videos 0755 - - -

# Install localized display descriptors (.directory) for Dolphin & KDE Plasma
C+ %h/Desktop/.directory - - - - /usr/share/user-directories/Desktop.directory
C+ %h/Documents/.directory - - - - /usr/share/user-directories/Documents.directory
C+ %h/Downloads/.directory - - - - /usr/share/user-directories/Downloads.directory
C+ %h/Music/.directory - - - - /usr/share/user-directories/Music.directory
C+ %h/Pictures/.directory - - - - /usr/share/user-directories/Pictures.directory
C+ %h/Public/.directory - - - - /usr/share/user-directories/Public.directory
C+ %h/Templates/.directory - - - - /usr/share/user-directories/Templates.directory
C+ %h/Videos/.directory - - - - /usr/share/user-directories/Videos.directory
