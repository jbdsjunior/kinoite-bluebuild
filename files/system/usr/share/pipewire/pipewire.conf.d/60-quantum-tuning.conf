# =====================================================================
# PIPEWIRE: Low-Latency & Glitch-Free Quantum Calibration
# =====================================================================
# Sets default graph quantum to 256 samples (~5.3ms @ 48kHz), cutting upstream
# latency (1024 = 21.3ms) by 75% while clamping min-quantum to 256 to prevent
# Bluetooth A2DP packet starvation and allowing up to 1024 for 96kHz LDAC safety.

context.properties = {
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 1024
}
