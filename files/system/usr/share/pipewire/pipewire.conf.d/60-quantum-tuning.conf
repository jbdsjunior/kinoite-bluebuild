# =====================================================================
# PIPEWIRE: Low-Latency Quantum Buffer Calibration (Desktop & Bluetooth)
# =====================================================================
# Calibra o quantum de processamento do grafo PipeWire para 512 amostras (~10.6ms @ 48kHz),
# eliminando a latência de ~21.3ms a 42.6ms decorrente dos buffers conservadores upstream (1024-2048),
# enquanto previne underruns (xruns) em dispositivos sem fio Bluetooth (LDAC, aptX, SBC-XQ).

context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
    default.clock.quantum       = 512
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 1024
}
