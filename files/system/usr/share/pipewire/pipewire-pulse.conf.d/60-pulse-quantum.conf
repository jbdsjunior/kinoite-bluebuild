# =====================================================================
# PIPEWIRE-PULSE: Low-Latency Default Request Calibration
# =====================================================================
# Aligns default PulseAudio client buffer requests to PipeWire's 256-sample
# quantum (~5.3ms @ 48kHz, down from 960/48000 = 20ms upstream).
# Preserves upstream min.req/min.frag/min.quantum (already 256/48000 in PipeWire 1.6+)
# and default.frag to avoid capture underruns on Bluetooth HFP/mSBC microphones.

pulse.properties = {
    pulse.default.req = 256/48000
}
