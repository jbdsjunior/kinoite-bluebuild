# =====================================================================
# PIPEWIRE-PULSE: Low-Latency Client Emulation Buffer Calibration
# =====================================================================
# Sintoniza a camada de emulação PulseAudio para requisitar buffers alinhados ao quantum
# nativo do PipeWire (512 amostras = 10.6ms), mitigando atrasos em players de mídia,
# navegadores e jogos sem gerar estouros de fragmentação (xruns).

pulse.properties = {
    pulse.min.req          = 256/48000
    pulse.default.req      = 512/48000
    pulse.min.frag         = 256/48000
    pulse.default.frag     = 512/48000
    pulse.min.quantum      = 256/48000
}
