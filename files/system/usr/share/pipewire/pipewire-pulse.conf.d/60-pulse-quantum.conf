# =====================================================================
# PIPEWIRE-PULSE: Low-Latency Client Emulation Buffer Calibration
# =====================================================================
# Sintoniza a camada de emulação PulseAudio para requisitar buffers alinhados ao quantum
# nativo do PipeWire (256 amostras = 5.3ms), mitigando atrasos em players de mídia,
# navegadores e jogos sem gerar estouros de fragmentação (xruns).

pulse.properties = {
    pulse.min.req          = 128/48000
    pulse.default.req      = 256/48000
    pulse.min.frag         = 128/48000
    pulse.default.frag     = 256/48000
    pulse.min.quantum      = 128/48000
}
