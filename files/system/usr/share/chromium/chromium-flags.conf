# Native Wayland execution on KDE Plasma 6
--ozone-platform=wayland

# AMD Radeon RX 6600 XT GPU rasterization & zero-copy DMA-BUF texture upload
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--enable-smooth-scrolling

# Hardware VA-API video decode & PipeWire camera (avoids WebRTC VA-API encode, ZeroCopyDesktopCapture & KWin overlay glitches)
--enable-features=VaapiIgnoreDriverChecks,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,UiGpuRasterization,WaylandTextInputV3,WebRtcPipeWireCamera,ParallelDownloading

# Telemetry and background bloat reduction
--disable-breakpad
--no-pings
--disable-domain-reliability
--disable-features=Translate,OptimizationHints,MediaRouter
