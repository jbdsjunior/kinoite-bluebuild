# Native Wayland execution on KDE Plasma 6 (safe fallback when outside Wayland)
--ozone-platform-hint=auto

# AMD Radeon RX 6600 XT GPU rasterization & zero-copy DMA-BUF texture upload
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--enable-smooth-scrolling

# Hardware VA-API video decode & PipeWire camera (avoids WebRTC VA-API encode, ZeroCopyDesktopCapture, KWin overlay & us-alt-intl dead-key glitches)
--enable-features=VaapiIgnoreDriverChecks,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,WebRtcPipeWireCamera,ParallelDownloading

# Telemetry and background bloat reduction (preserves MediaRouter/Cast)
--disable-breakpad
--no-pings
--disable-domain-reliability
--disable-features=Translate,OptimizationHints
