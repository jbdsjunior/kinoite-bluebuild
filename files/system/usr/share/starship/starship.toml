"$schema" = 'https://starship.rs/config-schema.json'

# ==========================================
add_newline = false  # Mudado para false - evita quebra de linha excessiva
command_timeout = 2000  # Aumentado de 1000 para 2000ms (repos git grandes)
palette = "kinoite"

# ==========================================
format = """
$os$username$hostname$shlvl$directory$git_branch$git_status$fill$cmd_duration$status
$character"""

# ==========================================
[palettes.kinoite]
fg = "#d9e0ee"
blue = "#7aa2f7"
green = "#9ece6a"
yellow = "#e0af68"
red = "#f7768e"
gray = "#6c7086"
cyan = "#7dcfff"
magenta = "#bb9af7"
orange = "#ff9e64"

# ==========================================
[os]
disabled = false
format = "[$symbol ]($style)"
style = "bold blue"

[os.symbols]
Linux = ""
Fedora = ""
Arch = ""
Debian = ""
Ubuntu = ""
Macos = ""
Windows = ""

[username]
show_always = false
style_user = "bold green"
style_root = "bold red"
format = "[$user ]($style)"

[hostname]
ssh_only = false  # Mudado para false - mostra em containers também
detect_env_vars = ["DISTROBOX_NAME"]  # Mostra quando está no Distrobox
style = "bold yellow"
format = "[@$hostname ]($style)"

[shlvl]
disabled = false
symbol = ""
threshold = 2  # Só mostra quando está em 2+ níveis de shell (subshells/containers)
format = "[$symbol$shlvl ]($style)"
style = "bold cyan"

[directory]
style = "bold fg"
truncation_length = 6  # Aumentado de 4 para 6
truncate_to_repo = false
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($red) "

# ==========================================
# GIT
# ==========================================

[git_branch]
symbol = " "
style = "bold blue"
format = "[$symbol$branch ]($style)"

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind ]($style))"

# ==========================================
# LINGUAGENS DE PROGRAMAÇÃO
# Todos disabled por padrão, ativam automaticamente quando detectados
# ==========================================

[python]
disabled = false
symbol = " "
style = "bold yellow"
format = "[$symbol$version ]($style)"
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile"]

[nodejs]
disabled = false
symbol = " "
style = "bold green"
format = "[$symbol$version ]($style)"
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files = ["package.json", ".node-version"]

[golang]
disabled = false
symbol = " "
style = "bold cyan"
format = "[$symbol$version ]($style)"
detect_extensions = ["go"]
detect_files = ["go.mod", "go.work"]

[rust]
disabled = false
symbol = " "
style = "bold red"
format = "[$symbol$version ]($style)"
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

[nix_shell]
disabled = false
symbol = " "
style = "bold blue"
format = "[$symbol$state ]($style)"

# ==========================================
# CONTAINERS E VIRTUALIZAÇÃO
# ==========================================

[docker_context]
disabled = true  # Desabilitado - projeto usa Podman, não Docker

[container]
disabled = false
symbol = "⬢"
style = "bold red"
format = "[$symbol $name ]($style)"

# ==========================================
# SISTEMA E MONITORAMENTO
# ==========================================

[memory_usage]
disabled = false
threshold = 80  # Só mostra quando usar 80%+ da RAM (51GB de 64GB)
symbol = "󰍛"
style = "bold red"
format = "[$symbol ${ram_pct}]($style) "

[sudo]
disabled = false
symbol = "🔒"
style = "bold red"
format = "[$symbol ]($style)"

[status]
disabled = false
symbol = "✗"
success_symbol = ""
format = "[$symbol $status ]($style)"
style = "bold red"

# ==========================================
# UTILITÁRIOS
# ==========================================

[fill]
symbol = " "

[cmd_duration]
min_time = 800
style = "gray"
format = "[$duration]($style) "

[env_var.DISTROBOX_NAME]
disabled = false
variable = "DISTROBOX_NAME"
default = ""
style = "bold magenta"
format = "[$env_value ]($style)"

# ==========================================
# CARACTERES DO PROMPT
# ==========================================

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
# Removido vimcmd_symbol - usuário usa nano, não vim
# Se quiser um símbolo para modo de edição, use algo neutro:
# vimcmd_symbol = "[❮](bold blue)"
# vimcmd_replace_symbol = "[❯](bold blue)"
# vimcmd_visual_symbol = "[❮](bold yellow)"

# ==========================================
# MÓDULOS DESABILITADOS (Bloat Removal)
# ==========================================

