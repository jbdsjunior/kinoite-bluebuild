<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- =======================================================================
       1. HIERARQUIA PRINCIPAL PARA TERMINAL E CÓDIGO
       Define a ordem de preferência quando o sistema pede uma fonte "monospace"
       ======================================================================= -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Monaspace Neon Nerd Font</family>
      <family>Liberation Mono</family>
    </prefer>
  </alias>

  <!-- =======================================================================
       2. FALLBACK DE ÍCONES E SÍMBOLOS (REDE DE SEGURANÇA)
       Garante que a "Symbols Nerd Font" cubra qualquer ícone ausente
       mesmo que o Konsole chame a fonte pelo nome específico.
       ======================================================================= -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>Monaspace Neon Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font</string>
    </edit>
  </match>

  <!-- =======================================================================
       3. ATIVAÇÃO DE LIGADURAS TIPOGRÁFICAS
       Permite que símbolos como "=>" virem uma seta contínua.
       ======================================================================= -->
  <match target="font">
    <test name="family" compare="contains"><string>JetBrainsMono</string></test>
    <edit name="fontfeatures" mode="assign">
      <string>calt=1</string>
      <string>liga=1</string>
    </edit>
  </match>

</fontconfig>
