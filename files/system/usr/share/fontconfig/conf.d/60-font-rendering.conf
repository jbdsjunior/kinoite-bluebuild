<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prioridade e ordem de preferência para a família genérica monospace -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>JetBrainsMono NF</family>
      <family>Hack</family>
      <family>Noto Sans Mono</family>
      <family>Liberation Mono</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <!-- Fallback global para pedidos de monospace genérico -->
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
      <string>Symbols Nerd Font</string>
    </edit>
  </match>

  <!-- Fallbacks específicos para as fontes mono padrão do Fedora / KDE Plasma -->
  <match target="pattern">
    <test name="family" qual="any"><string>Hack</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
      <string>Symbols Nerd Font</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
      <string>Symbols Nerd Font</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Liberation Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
      <string>Symbols Nerd Font</string>
    </edit>
  </match>
</fontconfig>
