<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  =============================================================================
  60-font-rendering.conf - Configuração de Fontes para Kinoite BlueBuild
  =============================================================================
  Este arquivo configura renderização de fontes, substituições e fallbacks
  para o sistema Fedora Kinoite com KDE Plasma.

  HARDWARE BASELINE: Ryzen 9 5950X, 64GB RAM, RX 6600 XT, monitor 1440p/4K

  FONTES INSTALADAS (via recipes/common-fonts.yml):
    - Liberation (Sans, Serif, Mono) - clones livres das fontes Microsoft
    - Noto (Sans, Serif, Mono, Color Emoji, CJK) - fontes universais do Google
    - JetBrains Mono - fonte moderna para coding
    - Fira Code, Hack (Nerd Fonts) - fontes com ícones para terminal
    - ms-core-fonts (via Terra) - Arial, Times, Verdana, etc. (proprietárias)

  COMPATIBILIDADE:
    - Qt 6 (KDE Plasma): ✓ Suporte nativo a emojis e CJK
    - GTK 3/4: ✓ Configuração de emoji e fallback
    - Wayland: ✓ Renderização subpixel otimizada
    - X11: ✓ Compatibilidade total

  PERSONALIZAÇÃO:
    Para sobrescrever estas configurações, crie:
    ~/.config/fontconfig/fonts.conf

  TROUBLESHOOTING:
    - Emojis em preto-e-branco: Verifique se google-noto-color-emoji-fonts está instalado
    - "Tofu" (quadrados) em sites asiáticos: Instale google-noto-sans-cjk-ttc-fonts
    - Fontes borradas em 4K: Ajuste hintstyle para hintnone
  =============================================================================
-->
<fontconfig>

  <!-- =======================================================================
       CONFIGURAÇÕES GLOBAIS DE RENDERIZAÇÃO
       =======================================================================
       Otimizado para telas modernas (1440p/4K) com subpixel rendering.
       Em telas de baixa DPI (1080p), hintslight é ideal.
       Em telas de alta DPI (4K), hintnone produz texto mais suave.
       ======================================================================= -->
  <match target="font">
    <!-- Antialiasing: sempre habilitado para suavizar bordas -->
    <edit name="antialias" mode="assign"><bool>true</bool></edit>

    <!-- Hinting: alinha glyphs à grade de pixels -->
    <edit name="hinting" mode="assign"><bool>true</bool></edit>

    <!-- Hintstyle: hintslight é seguro para todas as telas -->
    <!-- Para 4K, considere mudar para hintnone -->
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>

    <!-- Subpixel rendering: RGB para monitores LCD padrão -->
    <!-- Para monitores BGR ou verticais, ajuste conforme necessário -->
    <edit name="rgba" mode="assign"><const>rgb</const></edit>

    <!-- LCD filter: reduz color fringing em subpixel rendering -->
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>

    <!-- Autohint: desabilitado (fontes modernas já têm hinting bom) -->
    <edit name="autohint" mode="assign"><bool>false</bool></edit>

    <!-- Embedded bitmaps: desabilitado (renderiza mal em telas modernas) -->
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>

    <!-- Min space: previne redução de espaçamento entre caracteres -->
    <edit name="minspace" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- =======================================================================
       SUBSTITUIÇÕES DE FONTES MICROSOFT
       =======================================================================
       Se ms-core-fonts estiver instalado (via Terra), as fontes reais são usadas.
       Caso contrário, Liberation (métricamente idêntica) é usada como fallback.
       ======================================================================= -->

  <!-- Arial → Liberation Sans (fallback se Arial não estiver instalada) -->
  <match target="pattern">
    <test name="family" qual="any"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Liberation Sans</string></edit>
  </match>

  <!-- Helvetica → Liberation Sans (Arial é métricamente idêntica a Helvetica) -->
  <match target="pattern">
    <test name="family" qual="any"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Liberation Sans</string></edit>
  </match>

  <!-- Times New Roman → Liberation Serif -->
  <match target="pattern">
    <test name="family" qual="any"><string>Times New Roman</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Liberation Serif</string></edit>
  </match>

  <!-- Times → Liberation Serif -->
  <match target="pattern">
    <test name="family" qual="any"><string>Times</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Liberation Serif</string></edit>
  </match>

  <!-- Courier New → Liberation Mono -->
  <match target="pattern">
    <test name="family" qual="any"><string>Courier New</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Liberation Mono</string></edit>
  </match>

  <!-- Courier → Liberation Mono -->
  <match target="pattern">
    <test name="family" qual="any"><string>Courier</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Liberation Mono</string></edit>
  </match>

  <!-- Calibri → Carlito (métricamente compatível) -->
  <match target="pattern">
    <test name="family" qual="any"><string>Calibri</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Carlito</string></edit>
  </match>

  <!-- Cambria → Caladea (métricamente compatível) -->
  <match target="pattern">
    <test name="family" qual="any"><string>Cambria</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Caladea</string></edit>
  </match>

  <!-- Verdana → DejaVu Sans (alternativa livre) -->
  <match target="pattern">
    <test name="family" qual="any"><string>Verdana</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans</string></edit>
  </match>

  <!-- Tahoma → DejaVu Sans -->
  <match target="pattern">
    <test name="family" qual="any"><string>Tahoma</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans</string></edit>
  </match>

  <!-- Trebuchet MS → DejaVu Sans -->
  <match target="pattern">
    <test name="family" qual="any"><string>Trebuchet MS</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans</string></edit>
  </match>

  <!-- Georgia → DejaVu Serif -->
  <match target="pattern">
    <test name="family" qual="any"><string>Georgia</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Serif</string></edit>
  </match>

  <!-- Segoe UI → Noto Sans (usado por aplicações Windows/Wine) -->
  <match target="pattern">
    <test name="family" qual="any"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans</string></edit>
  </match>

  <!-- San Francisco → Noto Sans (fonte do macOS) -->
  <match target="pattern">
    <test name="family" qual="any"><string>San Francisco</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans</string></edit>
  </match>

  <!-- Comic Sans MS → Comic Neue (alternativa livre) -->
  <match target="pattern">
    <test name="family" qual="any"><string>Comic Sans MS</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Comic Neue</string></edit>
  </match>

  <!-- Cambria Math → STIX Two Math (símbolos matemáticos) -->
  <match target="pattern">
    <test name="family" qual="any"><string>Cambria Math</string></test>
    <edit name="family" mode="prepend" binding="same"><string>STIX Two Math</string></edit>
  </match>

  <!-- =======================================================================
       FONTES DE SÍMBOLOS E ÍCONES
       ======================================================================= -->

  <!-- Wingdings → Symbols Nerd Font -->
  <match target="pattern">
    <test name="family" qual="any"><string>Wingdings</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Symbols Nerd Font</string></edit>
  </match>

  <!-- Webdings → Symbols Nerd Font -->
  <match target="pattern">
    <test name="family" qual="any"><string>Webdings</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Symbols Nerd Font</string></edit>
  </match>

  <!-- =======================================================================
       PREFERÊNCIAS DE UI DO SISTEMA
       =======================================================================
       Define a ordem de preferência para famílias genéricas.
       O fontconfig usa a primeira fonte disponível na lista.
       ======================================================================= -->

  <!-- Sans-serif: UI geral, navegadores, aplicações -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
      <family>Ubuntu</family>
    </prefer>
  </alias>

  <alias>
    <family>sans</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- System UI: KDE Plasma, GNOME, etc -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- Serif: documentos, livros, artigos -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Liberation Serif</family>
      <family>DejaVu Serif</family>
      <family>FreeSerif</family>
    </prefer>
  </alias>

  <!-- Monospace: terminais, editores de código, logs -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Fira Code</family>
      <family>Hack</family>
      <family>Liberation Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- Cursive: texto decorativo -->
  <alias>
    <family>cursive</family>
    <prefer>
      <family>Comic Neue</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- Fantasy: texto decorativo/experimental -->
  <alias>
    <family>fantasy</family>
    <prefer>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- =======================================================================
       FALLBACK PARA CJK (CHINÊS, JAPONÊS, COREANO)
       =======================================================================
       Garante que caracteres CJK renderizem corretamente em aplicações web.
       Requer: google-noto-sans-cjk-ttc-fonts
       ======================================================================= -->

  <!-- Adiciona Noto Sans CJK como fallback para sans-serif -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
  </alias>

  <!-- Adiciona Noto Serif CJK como fallback para serif -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
  </alias>

  <!-- Adiciona Noto Sans Mono CJK como fallback para monospace -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
  </alias>

  <!-- =======================================================================
       CONFIGURAÇÃO DE EMOJIS
       =======================================================================
       Garante que emojis coloridos renderizem corretamente em Qt e GTK.
       Requer: google-noto-color-emoji-fonts
       ======================================================================= -->

  <!-- Adiciona Noto Color Emoji como fallback para todas as famílias -->
  <match target="pattern">
    <edit name="family" mode="append"><string>Noto Color Emoji</string></edit>
  </match>

  <!-- Configuração específica para emoji presentation em aplicações web -->
  <match>
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="scalable" mode="assign"><bool>true</bool></edit>
    <edit name="pixelsizefixupfactor" mode="assign"><double>1.0</double></edit>
  </match>

  <!-- Qt: força uso de emoji colorido -->
  <match target="pattern">
    <test name="family" compare="contains" ignore_blank="true">
      <string>emoji</string>
    </test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Color Emoji</string></edit>
  </match>

  <!-- =======================================================================
       OTIMIZAÇÕES ESPECÍFICAS PARA FONTES
       ======================================================================= -->

  <!-- JetBrains Mono: habilita ligatures (se suportado pela aplicação) -->
  <match target="font">
    <test name="family"><string>JetBrains Mono</string></test>
    <edit name="fontfeatures" mode="assign">
      <string>calt=1</string>
      <string>liga=1</string>
    </edit>
  </match>

  <!-- Fira Code: habilita ligatures -->
  <match target="font">
    <test name="family"><string>Fira Code</string></test>
    <edit name="fontfeatures" mode="assign">
      <string>calt=1</string>
      <string>liga=1</string>
    </edit>
  </match>

  <!-- Hack: desabilita ligatures (fonte mais tradicional) -->
  <match target="font">
    <test name="family"><string>Hack</string></test>
    <edit name="fontfeatures" mode="assign">
      <string>calt=0</string>
      <string>liga=0</string>
    </edit>
  </match>

  <!-- Noto Sans: otimiza para UI -->
  <match target="font">
    <test name="family"><string>Noto Sans</string></test>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>

  <!-- Noto Serif: otimiza para documentos -->
  <match target="font">
    <test name="family"><string>Noto Serif</string></test>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>

  <!-- =======================================================================
       CONFIGURAÇÕES PARA ALTA DPI (4K)
       =======================================================================
       Em monitores 4K, hintslight pode ser muito agressivo.
       Estas regras ajustam hintstyle baseado no tamanho da fonte.
       ======================================================================= -->

  <!-- Fontes pequenas (< 12pt): usa hintslight para legibilidade -->
  <match target="font">
    <test name="pixelsize" compare="less"><double>16</double></test>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>

  <!-- Fontes médias (12-18pt): usa hintslight -->
  <match target="font">
    <test name="pixelsize" compare="more_eq"><double>16</double></test>
    <test name="pixelsize" compare="less_eq"><double>24</double></test>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>

  <!-- Fontes grandes (> 18pt): usa hintnone para suavidade -->
  <match target="font">
    <test name="pixelsize" compare="more"><double>24</double></test>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
  </match>

</fontconfig>