---
cdiVersion: "0.5.0"
kind: "amd.com/gpu"
devices:
  - name: "0"
    containerEdits:
      deviceNodes:
        - path: "/dev/kfd"
        - path: "/dev/dri/renderD128"
        - path: "/dev/dri/card1"
      env:
        - "HSA_OVERRIDE_GFX_VERSION=10.3.0"
  - name: "all"
    containerEdits:
      deviceNodes:
        - path: "/dev/kfd"
        - path: "/dev/dri/renderD128"
        - path: "/dev/dri/card1"
      env:
        - "HSA_OVERRIDE_GFX_VERSION=10.3.0"
