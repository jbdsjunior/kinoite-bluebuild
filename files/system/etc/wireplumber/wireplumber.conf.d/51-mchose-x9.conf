monitor.alsa.rules = [
  {
    matches = [
      {
        "device.name" = "~alsa_card.usb-C-Media_Electronics_Inc_MCHOSE_X9.*"
      }
    ]
    actions = {
      update-props = {
        "api.alsa.soft-mixer" = false
        "api.alsa.ignore-dB" = true
        "audio.position" = [ "FL", "FR" ]
      }
    }
  }
]

# Default audio configuration for all devices
default.audio.adapter.profile.priority = [
  { "name" = "output:analog-stereo+input:analog-stereo" },
  { "name" = "output:iec958-stereo+input:analog-stereo" },
  { "name" = "output:analog-stereo" },
  { "name" = "input:analog-stereo" }
]

# Disable automatic Bluetooth HSP/HFP switching to avoid quality degradation
bluez5.autoswitch-to-hfp = false
bluez5.hsp-native = false


