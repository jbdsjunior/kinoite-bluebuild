# =====================================================================
# SSHD: Workstation Security Hardening
# =====================================================================

# Disallow root login over SSH (administrative access via wheel/sudo)
PermitRootLogin no

# Mitigate brute-force authentication attempts
MaxAuthTries 3

# Terminate dead sessions after inactivity
ClientAliveInterval 300
ClientAliveCountMax 2

# Disable X11 forwarding on native Wayland workstation
X11Forwarding no
