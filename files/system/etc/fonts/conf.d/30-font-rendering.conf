<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Global font rendering tuning (Anti-aliasing, Hinting, Subpixel LCD) -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Canonical alias: map Inter to Inter Variable font provided by rsms-inter-vf-fonts -->
  <match target="pattern">
    <test name="family" qual="any"><string>Inter</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
    </edit>
  </match>

  <!-- Monospace preference order -->
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>JetBrainsMono NF</string>
      <string>FiraCode Nerd Font</string>
      <string>FiraCode NF</string>
      <string>Hack</string>
      <string>Noto Sans Mono</string>
      <string>Liberation Mono</string>
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>

  <!-- Modern code and terminal monospace font aliases -->
  <match target="pattern">
    <test name="family" qual="any"><string>ui-monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>JetBrainsMono NF</string>
      <string>FiraCode Nerd Font</string>
      <string>FiraCode NF</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Menlo</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>JetBrainsMono NF</string>
      <string>FiraCode Nerd Font</string>
      <string>FiraCode NF</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Monaco</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>JetBrainsMono NF</string>
      <string>FiraCode Nerd Font</string>
      <string>FiraCode NF</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Mono</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>JetBrainsMono NF</string>
      <string>FiraCode Nerd Font</string>
      <string>FiraCode NF</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SFMono</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>JetBrainsMono NF</string>
      <string>FiraCode Nerd Font</string>
      <string>FiraCode NF</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SFMono-Regular</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>JetBrainsMono NF</string>
      <string>FiraCode Nerd Font</string>
      <string>FiraCode NF</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Cascadia Code</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>JetBrainsMono NF</string>
      <string>FiraCode Nerd Font</string>
      <string>FiraCode NF</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Consolas</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>JetBrainsMono NF</string>
      <string>FiraCode Nerd Font</string>
      <string>FiraCode NF</string>
    </edit>
  </match>

  <!-- Modern UI and system font aliases (Apple & Microsoft system fonts) -->
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Inter</string>
      <string>Noto Sans</string>
      <string>Liberation Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Inter</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>ui-sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Inter</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>-apple-system</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Inter</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Inter</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Text</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Inter</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro Display</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Inter</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SF Pro</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Inter</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Helvetica Neue</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Inter</string>
      <string>Liberation Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Inter</string>
      <string>Noto Sans</string>
    </edit>
  </match>

  <!-- Generic serif font family fallback -->
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif</string>
      <string>Liberation Serif</string>
    </edit>
  </match>

  <!-- Fallback symbols for generic monospace requests -->
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
      <string>Symbols Nerd Font</string>
    </edit>
  </match>

  <!-- Fallback symbols for standard Fedora / KDE Plasma monospace fonts -->
  <match target="pattern">
    <test name="family" qual="any"><string>Hack</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
      <string>Symbols Nerd Font</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Liberation Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
      <string>Symbols Nerd Font</string>
    </edit>
  </match>
</fontconfig>
