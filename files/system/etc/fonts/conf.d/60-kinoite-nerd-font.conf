<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prefer FiraCode Nerd Font so Starship icons render in terminals using the monospace family. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>FiraCode Nerd Font</family>
      <family>FiraCode Nerd Font Mono</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <!-- Keep common Fira Code family requests on the patched Nerd Font variant. -->
  <alias>
    <family>Fira Code</family>
    <prefer>
      <family>FiraCode Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
