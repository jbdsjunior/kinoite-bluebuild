name: Relatório de Bug ou Regressão
description: Relatar um erro, falha de build ou regressão de hardware/software
title: "fix(<escopo>): <descrição sucinta>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por registrar este relatório. Por favor, forneça informações detalhadas para que possamos investigar.
  - type: textarea
    id: description
    attributes:
      label: Descrição do Problema
      description: Explique o que aconteceu de forma concisa.
      placeholder: Ao executar o comando X ou iniciar o container Y...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para Reproduzir
      description: Como reproduzir o problema passo a passo.
      placeholder: |
        1. Atualizar para o commit ABC
        2. Executar 'systemctl status ...'
        3. Observar erro no log
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs e Diagnóstico
      description: Saída de 'journalctl', 'dmesg', 'tests/run_tests.sh' ou logs do GitHub Actions.
      render: shell
    validations:
      required: false
