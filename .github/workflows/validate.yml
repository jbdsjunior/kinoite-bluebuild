name: validate
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint recipes and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install linters
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck yamllint

      - name: YAML lint (recipes and workflows)
        run: |
          set -euo pipefail
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' \
            recipes .github/workflows .github/dependabot.yml

      - name: ShellCheck
        run: |
          set -euo pipefail
          shellcheck -S warning \
            files/system/usr/bin/kinoite-optimize \
            files/system/usr/bin/kinoite-setup-tpm \
            files/system/etc/profile.d/*.sh

      - name: Bash syntax check
        run: |
          set -euo pipefail
          for f in files/system/usr/bin/* files/system/etc/profile.d/*.sh; do
            bash -n "$f"
          done
