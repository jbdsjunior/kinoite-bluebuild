name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Recipes, Scripts & Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate shell scripts (bash -n)
        run: |
          find files/system/usr/bin -type f -exec bash -n {} +
          find files/ -name "*.sh" -type f -exec bash -n {} +

      - name: Validate YAML syntax & PROJECTS.md coverage
        run: |
          python3 -c '
          import pathlib, sys, yaml
          for ext in ("*.yml", "*.yaml"):
              for p in pathlib.Path(".").rglob(ext):
                  yaml.safe_load(p.read_text())
          proj = pathlib.Path("PROJECTS.md").read_text()
          files = [str(p) for p in pathlib.Path(".").rglob("*") if p.is_file() and ".git" not in p.parts]
          missing = [f for f in files if f not in proj]
          if missing:
              print("Missing from PROJECTS.md:", missing, file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(files)}/{len(files)} files documented in PROJECTS.md")
          '

      - name: Validate BlueBuild recipes
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work ghcr.io/blue-build/cli:v0.9.40 validate recipes/recipe-amd.yml
          docker run --rm -v "${{ github.workspace }}:/work" -w /work ghcr.io/blue-build/cli:v0.9.40 validate recipes/recipe-dual.yml
