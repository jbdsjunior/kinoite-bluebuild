name: validate

# Static validation only: this workflow never builds or publishes images.
# Image builds stay manual (workflow_dispatch) or via check-updates.yml.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must stay in sync with `cli_version` in build-image.yml (asserted below).
  BLUEBUILD_CLI_VERSION: v0.9.40
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  lint:
    name: Shell, YAML and Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (pinned + checksum)
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          curl -fsSL "$URL" -o "/tmp/${ARCHIVE}"
          echo "${ACTIONLINT_SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Lint workflows (actionlint)
        run: actionlint -color

      - name: Lint shell scripts (shellcheck)
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh' '.github/scripts/*.sh' 'files/**/usr/bin/*')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "ERROR: no shell scripts found to lint" >&2
            exit 1
          fi
          printf 'Linting: %s\n' "${scripts[@]}"
          shellcheck -S warning "${scripts[@]}"

      - name: Lint YAML (yamllint)
        run: yamllint --strict -f github .

  recipes:
    name: BlueBuild recipes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CLI version consistency
        run: |
          set -euo pipefail
          if ! grep -q "cli_version: ${BLUEBUILD_CLI_VERSION}" .github/workflows/build-image.yml; then
            echo "ERROR: BLUEBUILD_CLI_VERSION (${BLUEBUILD_CLI_VERSION}) does not match" >&2
            echo "       cli_version in .github/workflows/build-image.yml" >&2
            exit 1
          fi

      - name: Resolve base image references
        run: |
          set -euo pipefail
          shopt -s nullglob
          for recipe in recipes/recipe-*.yml; do
            image="$(.github/scripts/resolve-base-digest.sh --image-only "$recipe")"
            if [ -z "$image" ]; then
              echo "ERROR: empty base image reference for $recipe" >&2
              exit 1
            fi
            echo "$recipe -> $image"
          done

      - name: Fetch BlueBuild CLI from the pinned release image
        env:
          IMAGE: ghcr.io/blue-build/cli:v0.9.40-installer
        run: |
          set -euo pipefail
          docker create --name bluebuild-installer "$IMAGE"
          docker cp bluebuild-installer:/out/bluebuild ./bluebuild
          docker rm bluebuild-installer
          chmod +x ./bluebuild
          ./bluebuild --version | grep -q "${BLUEBUILD_CLI_VERSION#v}"

      - name: Validate recipes
        run: |
          set -euo pipefail
          shopt -s nullglob
          recipes=(recipes/recipe-*.yml)
          if [ ${#recipes[@]} -eq 0 ]; then
            echo "ERROR: no recipes/recipe-*.yml found" >&2
            exit 1
          fi
          for recipe in "${recipes[@]}"; do
            echo "==> ${recipe}"
            ./bluebuild validate --all-errors "$recipe"
          done
