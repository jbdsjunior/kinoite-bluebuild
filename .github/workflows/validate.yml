name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Recipes, Configs & Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate shell scripts syntax
        run: |
          set -euo pipefail
          bash -n \
            files/base/usr/bin/kinoite-optimize \
            files/base/usr/bin/kinoite-setup-tpm \
            files/base/etc/NetworkManager/dispatcher.d/04-iscsi \
            files/desktop/etc/profile.d/*.sh

      - name: Validate YAML, TOML, XML, and JSON/JSONC syntax
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-yaml
          }
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import tomllib
          import xml.etree.ElementTree as ET
          import yaml

          root = pathlib.Path(".")
          targets = {".yml", ".yaml", ".toml", ".xml", ".json", ".jsonc"}
          for path in sorted(root.rglob("*")):
              if not path.is_file() or ".git" in path.parts:
                  continue
              suffix = path.suffix.lower()
              if suffix not in targets:
                  continue
              text = path.read_text(encoding="utf-8")
              if suffix in {".yml", ".yaml"}:
                  yaml.safe_load(text)
              elif suffix == ".toml":
                  tomllib.loads(text)
              elif suffix == ".xml":
                  ET.fromstring(text)
              elif suffix == ".json":
                  json.loads(text)
              elif suffix == ".jsonc":
                  cleaned = re.sub(r"(?m)^\s*//.*$", "", text)
                  json.loads(cleaned)
          print("All structured configuration files parsed cleanly.")
          PY

      - name: Install BlueBuild CLI and validate recipes
        run: |
          set -euo pipefail
          sudo docker create --name blue-build-installer ghcr.io/blue-build/cli:v0.9.40-installer
          sudo docker cp blue-build-installer:/out/bluebuild /usr/local/bin/bluebuild
          sudo docker rm blue-build-installer
          bluebuild --version
          bluebuild validate recipes/recipe-amd.yml
          bluebuild validate recipes/recipe-cuda.yml

      - name: Verify 100% file coverage in PROJECTS.md
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          projects = pathlib.Path("PROJECTS.md").read_text(encoding="utf-8")
          missing = [p for p in tracked if p not in projects]
          if missing:
              print("Files missing from PROJECTS.md:", *missing, sep="\n  - ")
              sys.exit(1)
          print(f"Verified 100% coverage for {len(tracked)} tracked files in PROJECTS.md.")
          PY
