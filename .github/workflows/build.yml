name: build

# Single entry point for image builds. Triggered manually (workflow_dispatch)
# or by check-updates.yml when the upstream base image changed and the
# published image is stale.

run-name: build (${{ inputs.flavor }})

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to build"
        required: true
        type: choice
        options:
          - all
          - amd
          - dual
        default: all

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  setup:
    name: Setup build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          case "${{ inputs.flavor }}" in
            amd)
              echo 'matrix={"include":[{"flavor":"amd","recipe":"recipe-amd.yml"}]}' >> "$GITHUB_OUTPUT"
              ;;
            dual)
              echo 'matrix={"include":[{"flavor":"dual","recipe":"recipe-dual.yml"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'matrix={"include":[{"flavor":"amd","recipe":"recipe-amd.yml"},{"flavor":"dual","recipe":"recipe-dual.yml"}]}' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build Custom ${{ matrix.flavor == 'dual' && 'Dual-GPU' || 'AMD' }} Image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize repository owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build Custom ${{ matrix.flavor }} Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: ${{ steps.repo.outputs.owner }}
          # Required by blue-build/github-action action.yml schema (0 when not a PR event)
          pr_event_number: ${{ github.event.number || 0 }}
          use_cache: true
          retry_push_count: 3
          cli_version: v0.9.40
          verify_install: false
          use_unstable_cli: false
          skip_checkout: true
          max_layers: 256
          chunkah: true
