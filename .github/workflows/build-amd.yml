name: build-amd
on:
  workflow_dispatch:

concurrency:
  group: build-pipeline-amd-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

# env:
#   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  security-scan:
    name: Security scan (AMD)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy scan (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          sarif_file: trivy-results.sarif

  build-amd:
    name: Build Custom AMD Image
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Custom AMD Image
        uses: blue-build/github-action@main
        with:
          recipe: recipe-amd.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          retry_push_count: 3
          verify_install: true
          use_unstable_cli: true
          skip_checkout: true
          chunkah: false
          maximize_build_space: true # enabled by default, disable if your image is small and you want faster builds
