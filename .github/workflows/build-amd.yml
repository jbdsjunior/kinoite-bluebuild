name: build-amd
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: build-pipeline-amd-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  build-amd:
    name: Build Custom AMD Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize repository owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build Custom AMD Image
        uses: blue-build/github-action@v1
        with:
          recipe: recipe-amd.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: ${{ steps.repo.outputs.owner }}
          pr_event_number: ${{ github.event.number }}
          use_cache: true
          retry_push_count: 3
          verify_install: true
          use_unstable_cli: false
          skip_checkout: true
          max_layers: 512
          chunkah: true
          maximize_build_space: true

  security-scan:
    name: Security scan (AMD)
    needs: build-amd
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Normalize repository owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy scan (Image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_AUTH_URL: ghcr.io
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          scan-type: image
          image-ref: ghcr.io/${{ steps.repo.outputs.owner }}/kinoite-amd:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true


      - name: Upload SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          sarif_file: trivy-results.sarif

  notify-push:
    name: Notify Tailscale Device (Push)
    needs: [build-amd, security-scan]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect to Tailscale (OAuth Mesh)
        if: env.TS_OAUTH_CLIENT_ID != '' && env.TS_OAUTH_SECRET != ''
        uses: tailscale/github-action@v3
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Send Authenticated Push Trigger
        if: env.UPDATE_RECEIVER_URL != '' && env.UPDATE_HMAC_SECRET != ''
        env:
          UPDATE_RECEIVER_URL: ${{ secrets.UPDATE_RECEIVER_URL }}
          UPDATE_HMAC_SECRET: ${{ secrets.UPDATE_HMAC_SECRET }}
        run: |
          TIMESTAMP=$(date +%s)
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/kinoite-amd:latest"
          PAYLOAD="{\"timestamp\": $TIMESTAMP, \"image\": \"$IMAGE_REF\", \"event\": \"image_published\"}"
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$UPDATE_HMAC_SECRET" | cut -d' ' -f2)

          echo "Dispatching authenticated push notification to $UPDATE_RECEIVER_URL..."
          curl -f -sS -X POST "$UPDATE_RECEIVER_URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $SIGNATURE" \
            -H "X-Timestamp: $TIMESTAMP" \
            -d "$PAYLOAD" \
            --retry 3 --max-time 15
          echo "Push notification dispatched successfully."
