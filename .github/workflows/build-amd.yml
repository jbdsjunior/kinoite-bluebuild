name: build-amd
on:
  # pull_request:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'
  #     - '.github/workflows/cleanup.yml'
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'
  #     - '.github/workflows/cleanup.yml'
  workflow_dispatch:

concurrency:
  group: build-pipeline-amd-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  build-amd:
    name: Build Custom AMD Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize repository owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build Custom AMD Image
        uses: blue-build/github-action@v1
        with:
          recipe: recipe-amd.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: ${{ steps.repo.outputs.owner }}
          pr_event_number: ${{ github.event.number }}
          use_cache: true
          retry_push_count: 3
          verify_install: true
          use_unstable_cli: false
          skip_checkout: true
          max_layers: 512
          chunkah: true
          maximize_build_space: true

  security-scan:
    name: Security scan (AMD)
    needs: build-amd
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Normalize repository owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy scan (Image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_AUTH_URL: ghcr.io
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          scan-type: image
          image-ref: ghcr.io/${{ steps.repo.outputs.owner }}/kinoite-amd:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true


      - name: Upload SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: trivy-results.sarif
