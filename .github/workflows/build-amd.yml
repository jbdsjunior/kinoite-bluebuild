name: build-amd
on:
  workflow_dispatch:

concurrency:
  group: build-pipeline-amd-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security scan (AMD)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy scan (filesystem)
        uses: aquasecurity/trivy-action@91713af97dc80187565512baba9e71a34a63f9b3 # v0.26.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@df409f729e32721802292513ba1afe4ebe23a559 # v3.27.5
        with:
          sarif_file: trivy-results.sarif

  build-amd:
    name: Build Custom AMD Image
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Custom AMD Image
        uses: blue-build/github-action@v1.12.0
        with:
          recipe: recipe-amd.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          retry_push_count: 3
          verify_install: true
          skip_checkout: true
          chunkah: false
          maximize_build_space: false
