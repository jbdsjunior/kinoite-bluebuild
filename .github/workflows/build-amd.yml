name: build-amd
on:
  workflow_dispatch:
    inputs:
      upstream_digest:
        description: "Upstream base image digest that triggered the build (optional, resolved automatically if blank)"
        required: false
        default: ""

concurrency:
  group: build-pipeline-amd-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  build-amd:
    name: Build Custom AMD Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize repository owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream digest for cache
        id: digest
        env:
          INPUT_DIGEST: ${{ inputs.upstream_digest }}
        run: |
          set -euo pipefail
          DIGEST="${INPUT_DIGEST}"
          if [[ -z "${DIGEST}" ]]; then
            RECIPE_FILE="recipes/recipe-amd.yml"
            BASE_IMG=$(awk -F': ' '/^base-image:/ {print $2; exit}' "$RECIPE_FILE" | tr -d '"'\'' ')
            IMG_VER=$(awk -F': ' '/^image-version:/ {print $2; exit}' "$RECIPE_FILE" | tr -d '"'\'' ')
            FULL_IMG="${BASE_IMG}:${IMG_VER}"
            if ! command -v skopeo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends skopeo
            fi
            DIGEST=$(skopeo inspect "docker://${FULL_IMG}" --format '{{.Digest}}')
          fi

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          mkdir -p ~/.cache-amd
          echo "${DIGEST}" > ~/.cache-amd/upstream-digest.txt

      - name: Build Custom AMD Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1
        with:
          recipe: recipe-amd.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: ${{ steps.repo.outputs.owner }}
          use_cache: true
          retry_push_count: 3
          verify_install: true
          use_unstable_cli: false
          skip_checkout: true
          max_layers: 512

      - name: Save upstream cache on build success
        if: steps.digest.outputs.digest != ''
        continue-on-error: true
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: ~/.cache-amd
          key: upstream-amd-${{ steps.digest.outputs.digest }}
