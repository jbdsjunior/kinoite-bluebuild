name: build-amd
on:
  workflow_dispatch:
    inputs:
      upstream_digest:
        description: "Upstream base image digest that triggered the build (optional, resolved automatically if blank)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: build-pipeline-amd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-amd:
    uses: ./.github/workflows/build-image.yml
    with:
      flavor: amd
      recipe: recipe-amd.yml
      upstream_digest: ${{ inputs.upstream_digest }}
    secrets: inherit
