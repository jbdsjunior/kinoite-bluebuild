name: build-dual
on:
  workflow_dispatch:
    inputs:
      upstream_digest:
        description: "Upstream base image digest that triggered the build (optional, resolved automatically if blank)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: build-pipeline-dual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dual:
    uses: ./.github/workflows/build-image.yml
    with:
      flavor: dual
      recipe: recipe-dual.yml
      upstream_digest: ${{ inputs.upstream_digest }}
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
