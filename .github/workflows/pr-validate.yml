name: pr-validate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-yaml:
    name: Lint YAML and shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: yamllint recipes
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c
        with:
          file_or_dir: recipes/
          config_data: |
            extends: default
            rules:
              line-length: disable
              truthy: disable
              comments: disable
      - name: ShellCheck overlays
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck
          find files/system -name '*.sh' -print0 | xargs -0 -r shellcheck || true

  validate-recipe:
    name: Validate BlueBuild recipe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-yaml
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: BlueBuild dry-run
        uses: blue-build/github-action@v1
        with:
          recipe: recipe-amd.yml
          skip_checkout: true
          maximize_build_space: true
          cli_flags: "--no-push"
