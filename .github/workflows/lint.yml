name: lint
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'recipes/**'
      - '.github/workflows/**'
      - 'files/**'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Syntax Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linting Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yamllint shellcheck

      - name: Validate YAML syntax
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" recipes/ .github/workflows/

      - name: Validate Shell Scripts (ShellCheck & bash -n)
        run: |
          find scripts/ files/system/usr/bin/ -type f -name "*.sh" -o -perm /111 -exec bash -n {} +
          shellcheck scripts/*.sh files/system/usr/bin/* --severity=warning || true

      - name: Validate Python Scripts
        run: |
          python3 -m py_compile files/system/usr/libexec/kinoite-update-receiver

