name: cleanup
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: cleanup-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  delete-old-images:
    name: Delete Old Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete old package versions
        uses: actions/delete-package-versions@4dbb860504f6d0cde296a192842138c03915746a # v5.1.0
        with:
          package-name: "kinoite-amd"
          package-type: "container"
          min-versions-to-keep: 15
          delete-only-untagged-versions: "false"

  delete-old-runs-and-caches:
    name: Delete Old Runs and Stale Caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 3

      - name: Prune superseded actions caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Scanning for superseded Actions caches in $REPO..."
          CACHES_TO_DELETE=$(gh cache list --repo "$REPO" --limit 100 --json id,key,createdAt -q '.[] | select(.key | startswith("upstream-"))' | jq -s -r 'sort_by(.createdAt) | reverse | .[1:] | .[].id' 2>/dev/null || true)
          if [[ -n "${CACHES_TO_DELETE}" ]]; then
            echo "$CACHES_TO_DELETE" | while read -r cache_id; do
              if [[ -n "$cache_id" ]]; then
                echo "Deleting superseded cache ID: $cache_id"
                gh cache delete "$cache_id" --repo "$REPO" || true
              fi
            done
          else
            echo "No superseded caches found to prune."
          fi
