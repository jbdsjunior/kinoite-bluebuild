name: build-image

# Reusable build: pulls the base image, layers the recipe modules, pushes and
# signs the result. It carries no update-detection logic; deciding whether a
# build is needed is the job of check-updates.yml.

on:
  workflow_call:
    inputs:
      flavor:
        description: "Flavor name (amd or dual)"
        required: true
        type: string
      recipe:
        description: "Recipe filename in recipes/"
        required: true
        type: string
    secrets:
      SIGNING_SECRET:
        description: "Cosign private key used to sign the published image"
        required: true

jobs:
  build:
    name: Build Custom ${{ inputs.flavor == 'dual' && 'Dual-GPU' || 'AMD' }} Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize repository owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build Custom ${{ inputs.flavor }} Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1
        with:
          recipe: ${{ inputs.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: ${{ steps.repo.outputs.owner }}
          # Required by blue-build/github-action action.yml schema (0 when not a PR event)
          pr_event_number: ${{ github.event.number || 0 }}
          use_cache: true
          retry_push_count: 3
          cli_version: v0.9.40
          verify_install: false
          use_unstable_cli: false
          skip_checkout: true
          max_layers: 256
          chunkah: true
