name: build-image
on:
  workflow_call:
    inputs:
      flavor:
        description: "Flavor name (amd or dual)"
        required: true
        type: string
      recipe:
        description: "Recipe filename in recipes/"
        required: true
        type: string
      upstream_digest:
        description: "Upstream base image digest (optional, resolved automatically if blank)"
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build Custom ${{ inputs.flavor == 'dual' && 'Dual-GPU' || 'AMD' }} Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize repository owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream digest for cache
        id: digest
        env:
          INPUT_DIGEST: ${{ inputs.upstream_digest }}
          RECIPE_FILE: recipes/${{ inputs.recipe }}
        run: |
          set -euo pipefail
          DIGEST="${INPUT_DIGEST}"
          if [[ -z "${DIGEST}" ]]; then
            BASE_IMG=$(awk -F': ' '/^base-image:/ {print $2; exit}' "$RECIPE_FILE" | tr -d '"'\'' ')
            IMG_VER=$(awk -F': ' '/^image-version:/ {print $2; exit}' "$RECIPE_FILE" | tr -d '"'\'' ')
            FULL_IMG="${BASE_IMG}:${IMG_VER}"
            if ! command -v skopeo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends skopeo
            fi
            DIGEST=$(skopeo inspect "docker://${FULL_IMG}" --format '{{.Digest}}')
          fi

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          mkdir -p ~/.cache-${{ inputs.flavor }}
          echo "${DIGEST}" > ~/.cache-${{ inputs.flavor }}/upstream-digest.txt

      - name: Check if upstream cache entry exists
        id: cache-check
        if: steps.digest.outputs.digest != ''
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: ~/.cache-${{ inputs.flavor }}
          key: upstream-${{ inputs.flavor }}-${{ steps.digest.outputs.digest }}
          lookup-only: true

      - name: Build Custom ${{ inputs.flavor }} Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1
        with:
          recipe: ${{ inputs.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: ${{ steps.repo.outputs.owner }}
          # Required by blue-build/github-action action.yml schema (even if empty on workflow_dispatch)
          pr_event_number: ${{ github.event.number }}
          use_cache: true
          retry_push_count: 3
          cli_version: v0.9.40
          verify_install: false
          use_unstable_cli: false
          skip_checkout: true
          max_layers: 256
          chunkah: true

      - name: Save upstream cache on build success
        if: steps.digest.outputs.digest != '' && steps.cache-check.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: ~/.cache-${{ inputs.flavor }}
          key: upstream-${{ inputs.flavor }}-${{ steps.digest.outputs.digest }}
