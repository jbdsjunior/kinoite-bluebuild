name: check-updates
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# env:
#   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [amd]

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi

      - name: Ensure gh auth
        run: gh auth status
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve base image (${{ matrix.flavor }})
        id: resolve
        run: |
          set -euo pipefail
          RECIPE_FILE="recipes/recipe-${{ matrix.flavor }}.yml"
          BASE_IMG=$(awk -F': ' '/^base-image:/ {print $2; exit}' "$RECIPE_FILE" | tr -d '"'\'' ')
          IMG_VER=$(awk -F': ' '/^image-version:/ {print $2; exit}' "$RECIPE_FILE" | tr -d '"'\'' ')
          FULL_IMG="${BASE_IMG}:${IMG_VER}"

          if [[ -z "${BASE_IMG}" ]]; then
            echo "Failed to resolve base image from ${RECIPE_FILE}" >&2
            exit 1
          fi

          echo "image=${FULL_IMG}" >> "$GITHUB_OUTPUT"


      - name: Check base image digest (${{ matrix.flavor }})
        id: check
        run: |
          set -euo pipefail
          DIGEST=$(skopeo inspect "docker://${{ steps.resolve.outputs.image }}" --format '{{.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Check cache (${{ matrix.flavor }})
        id: cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: ~/.cache-${{ matrix.flavor }}
          key: upstream-${{ matrix.flavor }}-${{ steps.check.outputs.digest }}

      - name: Trigger build (${{ matrix.flavor }})
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          gh workflow run "build-${{ matrix.flavor }}.yml" --ref main --repo "${{ github.repository }}"

          mkdir -p ~/.cache-${{ matrix.flavor }}
          echo "${{ steps.check.outputs.digest }}" > ~/.cache-${{ matrix.flavor }}/upstream-digest.txt
        env:
          GH_TOKEN: ${{ github.token }}
