name: check-updates
on:
  schedule:
    # Check upstream base image updates every 2 hours (AGENTS.md §5)
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-trigger:
    name: Check Updates (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: amd
            recipe: recipes/recipe-amd.yml
          - flavor: dual
            recipe: recipes/recipe-dual.yml

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi

      - name: Resolve base image (${{ matrix.flavor }})
        id: resolve
        env:
          RECIPE_FILE: ${{ matrix.recipe }}
        run: |
          set -euo pipefail
          BASE_IMG=$(awk -F': ' '/^base-image:/ {print $2; exit}' "$RECIPE_FILE" | tr -d '"'\'' ')
          IMG_VER=$(awk -F': ' '/^image-version:/ {print $2; exit}' "$RECIPE_FILE" | tr -d '"'\'' ')
          FULL_IMG="${BASE_IMG}:${IMG_VER}"

          if [[ -z "${BASE_IMG}" ]]; then
            echo "Failed to resolve base image from ${RECIPE_FILE}" >&2
            exit 1
          fi

          echo "image=${FULL_IMG}" >> "$GITHUB_OUTPUT"

      - name: Check base image digest (${{ matrix.flavor }})
        id: check
        env:
          IMAGE_NAME: ${{ steps.resolve.outputs.image }}
        run: |
          set -euo pipefail
          DIGEST=$(skopeo inspect "docker://${IMAGE_NAME}" --format '{{.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Check upstream cache (${{ matrix.flavor }})
        id: cache
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: ~/.cache-${{ matrix.flavor }}
          key: upstream-${{ matrix.flavor }}-${{ steps.check.outputs.digest }}
          lookup-only: true

      # The cache key (upstream-<flavor>-<digest>) is the single source of truth:
      # a digest is built once, and the workflow concurrency group prevents
      # duplicate executions for the same flavor.
      - name: Trigger build (${{ matrix.flavor }})
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_DIGEST: ${{ steps.check.outputs.digest }}
          REPO: ${{ github.repository }}
          FLAVOR: ${{ matrix.flavor }}
          REPO_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Cache miss for ${FLAVOR} digest ${UPSTREAM_DIGEST}. Triggering build..."
          gh workflow run build.yml \
            --ref "$REPO_REF" \
            --repo "$REPO" \
            -f flavor="${FLAVOR}" \
            -f upstream_digest="${UPSTREAM_DIGEST}"
