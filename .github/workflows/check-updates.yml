name: check-updates
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check-and-trigger:
    name: Check Upstream Updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi

      - name: Ensure gh auth
        run: gh auth status
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve base image
        id: resolve
        run: |
          set -euo pipefail
          RECIPE_FILE="recipes/recipe-amd.yml"
          BASE_IMG=$(awk -F': ' '/^base-image:/ {print $2; exit}' "$RECIPE_FILE" | tr -d '"'\'' ')
          IMG_VER=$(awk -F': ' '/^image-version:/ {print $2; exit}' "$RECIPE_FILE" | tr -d '"'\'' ')
          FULL_IMG="${BASE_IMG}:${IMG_VER}"

          if [[ -z "${BASE_IMG}" ]]; then
            echo "Failed to resolve base image from ${RECIPE_FILE}" >&2
            exit 1
          fi

          echo "image=${FULL_IMG}" >> "$GITHUB_OUTPUT"

      - name: Check base image digest
        id: check
        env:
          IMAGE_NAME: ${{ steps.resolve.outputs.image }}
        run: |
          set -euo pipefail
          DIGEST=$(skopeo inspect "docker://${IMAGE_NAME}" --format '{{.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Check cache
        id: cache
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: ~/.cache-amd
          key: upstream-amd-${{ steps.check.outputs.digest }}

      - name: Trigger build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_DIGEST: ${{ steps.check.outputs.digest }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: build-amd.yml
        run: |
          set -euo pipefail

          # Avoid duplicate execution if build is already queued or running
          RUNNING=$(gh run list --repo "$REPO" --workflow="$WORKFLOW_FILE" --json status -q '.[] | select(.status == "in_progress" or .status == "queued") | .status' | head -n 1)
          if [[ -n "${RUNNING}" ]]; then
            echo "Build workflow $WORKFLOW_FILE is already ${RUNNING}. Skipping trigger to prevent duplicate execution."
            exit 0
          fi

          echo "Cache miss for digest ${UPSTREAM_DIGEST}. Triggering $WORKFLOW_FILE..."
          gh workflow run "$WORKFLOW_FILE" \
            --ref main \
            --repo "$REPO" \
            -f upstream_digest="${UPSTREAM_DIGEST}"
