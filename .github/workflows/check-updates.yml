name: check-updates
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-trigger:
    name: Check Updates (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: amd
            recipe: recipes/recipe-amd.yml
            workflow: build-amd.yml
          - flavor: dual
            recipe: recipes/recipe-dual.yml
            workflow: build-dual.yml

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi

      - name: Resolve base image (${{ matrix.flavor }})
        id: resolve
        env:
          RECIPE_FILE: ${{ matrix.recipe }}
        run: |
          set -euo pipefail
          IMAGE="$(.github/scripts/resolve-base-digest.sh --image-only "$RECIPE_FILE")"

          if [[ -z "${IMAGE}" ]]; then
            echo "Failed to resolve base image from ${RECIPE_FILE}" >&2
            exit 1
          fi

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Check base image digest (${{ matrix.flavor }})
        id: check
        env:
          RECIPE_FILE: ${{ matrix.recipe }}
          IMAGE_NAME: ${{ steps.resolve.outputs.image }}
        run: |
          set -euo pipefail
          echo "Inspecting ${IMAGE_NAME}"
          DIGEST=$(.github/scripts/resolve-base-digest.sh "$RECIPE_FILE")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Check upstream cache (${{ matrix.flavor }})
        id: cache
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: ~/.cache-${{ matrix.flavor }}
          key: upstream-${{ matrix.flavor }}-${{ steps.check.outputs.digest }}
          lookup-only: true

      - name: Trigger build (${{ matrix.flavor }})
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_DIGEST: ${{ steps.check.outputs.digest }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: ${{ matrix.workflow }}
          REPO_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Avoid duplicate execution if build is already queued or running
          RUNNING=$(gh run list --repo "$REPO" --workflow="$WORKFLOW_FILE" --json status -q '.[] | select(.status == "in_progress" or .status == "queued") | .status' | head -n 1)
          if [[ -n "${RUNNING}" ]]; then
            echo "Build workflow $WORKFLOW_FILE is already ${RUNNING}. Skipping trigger to prevent duplicate execution."
          else
            echo "Cache miss for ${{ matrix.flavor }} digest ${UPSTREAM_DIGEST}. Triggering $WORKFLOW_FILE..."
            gh workflow run "$WORKFLOW_FILE" \
              --ref "$REPO_REF" \
              --repo "$REPO" \
              -f upstream_digest="${UPSTREAM_DIGEST}"
          fi
