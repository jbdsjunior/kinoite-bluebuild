name: check-updates

# Scheduled freshness check (every 2 hours), stateless by design:
#
#   upstream digest = digest of the base image declared by the recipe
#   current digest  = `org.opencontainers.image.base.digest` label of the image
#                     already published to GHCR (written by the build)
#   repo input ts   = latest commit timestamp touching recipe/files/cosign.pub
#
# A build is dispatched only when the published image is missing, was built
# from another base, is behind the upstream digest, or is older than repo
# build inputs. Repeated runs are cheap and no external state is required.

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: check-updates
  cancel-in-progress: false

jobs:
  check:
    name: Check ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: amd
            recipe: recipes/recipe-amd.yml
            image: kinoite-amd
          - flavor: dual
            recipe: recipes/recipe-dual.yml
            image: kinoite-dual
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure skopeo is installed
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi

      - name: Compare upstream base and repo inputs with the published image
        id: compare
        env:
          FLAVOR: ${{ matrix.flavor }}
          RECIPE: ${{ matrix.recipe }}
          IMAGE: ${{ matrix.image }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          BASE_IMAGE="$(yq -r '.["base-image"] // ""' "$RECIPE")"
          IMAGE_VERSION="$(yq -r '.["image-version"] // ""' "$RECIPE")"
          if [[ -z "$BASE_IMAGE" || -z "$IMAGE_VERSION" ]]; then
            echo "ERROR: could not read base-image/image-version from $RECIPE" >&2
            exit 1
          fi
          BASE_REF="${BASE_IMAGE}:${IMAGE_VERSION}"

          UPSTREAM_DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${BASE_REF}")"
          if [[ -z "$UPSTREAM_DIGEST" ]]; then
            echo "ERROR: could not resolve the digest of ${BASE_REF}" >&2
            exit 1
          fi

          PUBLISHED="ghcr.io/${REPO_OWNER,,}/${IMAGE}:latest"
          IMAGE_META="$(skopeo inspect "docker://${PUBLISHED}" 2>/dev/null || true)"
          CURRENT_NAME="$(jq -r '.Labels["org.opencontainers.image.base.name"] // empty' <<<"$IMAGE_META" 2>/dev/null || true)"
          CURRENT_DIGEST="$(jq -r '.Labels["org.opencontainers.image.base.digest"] // empty' <<<"$IMAGE_META" 2>/dev/null || true)"
          IMAGE_CREATED="$(jq -r '.Labels["org.opencontainers.image.created"] // empty' <<<"$IMAGE_META" 2>/dev/null || true)"

          REPO_PATHS=("$RECIPE" "recipes/modules/common-*.yml" "files/system" "files/dnf" "cosign.pub")
          if [[ "$FLAVOR" == "dual" ]]; then
            REPO_PATHS+=("recipes/modules/dual-*.yml" "files/nvidia")
          fi
          LATEST_COMMIT_TS="$(git log -1 --format=%ct -- "${REPO_PATHS[@]}" || echo 0)"
          IMAGE_CREATED_TS=0
          if [[ -n "$IMAGE_CREATED" ]]; then
            IMAGE_CREATED_TS="$(date -d "$IMAGE_CREATED" +%s 2>/dev/null || echo 0)"
          fi

          echo "Recipe base    : ${BASE_REF}@${UPSTREAM_DIGEST}"
          echo "Published      : ${PUBLISHED}"
          echo "Image base     : ${CURRENT_NAME:-<none>}@${CURRENT_DIGEST:-<none>}"
          echo "Image created  : ${IMAGE_CREATED:-<none>} (epoch=${IMAGE_CREATED_TS})"
          echo "Latest input ts: ${LATEST_COMMIT_TS}"

          if [[ "$CURRENT_NAME" == "$BASE_REF" && "$CURRENT_DIGEST" == "$UPSTREAM_DIGEST" && "$LATEST_COMMIT_TS" -le "$IMAGE_CREATED_TS" ]]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch build if stale
        if: steps.compare.outputs.up_to_date != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_REF: ${{ github.ref_name }}
          FLAVOR: ${{ matrix.flavor }}
          # After a failed build, wait this many hours before retrying the flavor.
          BACKOFF_HOURS: "2"
        run: |
          set -euo pipefail

          RUNS="$(gh run list --repo "$REPO" --workflow=build.yml --limit 50 \
            --json status,conclusion,createdAt,displayTitle)"

          RUNNING="$(jq -r --arg f "$FLAVOR" '
            first(
              .[]
              | select(.status == "queued" or .status == "in_progress")
              | select((.displayTitle | endswith("(" + $f + ")")) or (.displayTitle | endswith("(all)")))
              | .status
            ) // empty' <<<"$RUNS")"

          if [[ -n "$RUNNING" ]]; then
            echo "build.yml is already ${RUNNING} for ${FLAVOR}; skipping dispatch."
            exit 0
          fi

          RECENT_FAILURE="$(jq -r --arg f "$FLAVOR" --argjson hours "$BACKOFF_HOURS" '
            (now - ($hours * 3600)) as $cutoff
            | first(
                .[]
                | select(.conclusion == "failure")
                | select((.displayTitle | endswith("(" + $f + ")")) or (.displayTitle | endswith("(all)")))
                | select((.createdAt | fromdateiso8601) > $cutoff)
                | .createdAt
              ) // empty' <<<"$RUNS")"

          if [[ -n "$RECENT_FAILURE" ]]; then
            echo "A ${FLAVOR} build failed at ${RECENT_FAILURE}; backing off ${BACKOFF_HOURS}h."
            exit 0
          fi

          echo "Published ${FLAVOR} image is stale; dispatching build.yml..."
          gh workflow run build.yml --repo "$REPO" --ref "$REPO_REF" -f flavor="$FLAVOR"

      - name: Report up to date
        if: steps.compare.outputs.up_to_date == 'true'
        run: echo "${IMAGE} is already built from the current upstream base."
        env:
          IMAGE: ${{ matrix.image }}
